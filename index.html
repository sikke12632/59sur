<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>59서바이벌 - 난이도 선택(노말/하드) 패치</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { margin: 0; overflow: hidden; background-color: #0d0d1a; font-family: 'Jua', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; user-select: none; }
        canvas { background-color: #1A1A2D; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.4); display: none; cursor: crosshair; }
        .screen-overlay { position: absolute; width: 800px; height: 600px; background-color: rgba(26, 26, 45, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; z-index: 10; backdrop-filter: blur(8px); border: 4px solid #00E5FF; box-sizing: border-box; padding: 20px; }
        
        h1 { color: #00E5FF; margin-bottom: 5px; font-size: 55px; text-shadow: 3px 3px 0 #FF3366, 0 0 15px rgba(0, 229, 255, 0.6); margin-top: 0; line-height: 1; }
        .season-badge { background: #FF3366; color: white; padding: 4px 15px; border-radius: 20px; font-size: 20px; margin-bottom: 10px; box-shadow: 0 0 10px #FF3366; }
        input[type="text"] { padding: 8px 15px; font-size: 18px; font-family: 'Jua', sans-serif; border-radius: 30px; background: #2A2A4D; color: #fff; text-align: center; margin-bottom: 10px; outline: none; border: 3px solid #00E5FF; width: 220px; }
        
        .control-select { display: flex; gap: 15px; margin-bottom: 5px; background: #2A2A4D; padding: 6px 15px; border-radius: 30px; border: 2px solid #555; }
        .control-select label { font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #aaa; transition: 0.2s; }
        .control-select input[type="radio"] { transform: scale(1.2); cursor: pointer; margin: 0; }
        .control-select input[type="radio"]:checked + span { color: #00E5FF; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }

        .action-buttons { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 10px; }
        button.main-btn { padding: 12px 20px; font-size: 20px; font-family: 'Jua', sans-serif; color: #fff; background: linear-gradient(45deg, #FF3366, #FF9933); border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0 #CC0044; transition: 0.1s; margin: 0; }
        button.main-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #CC0044; }
        button.store-btn { background: linear-gradient(45deg, #39FF14, #00B300); box-shadow: 0 5px 0 #007700; }
        button.ranking-btn { background: linear-gradient(45deg, #8E2DE2, #4A00E0); box-shadow: 0 5px 0 #310099; }
        
        .leaderboard-container { background: rgba(42, 42, 77, 0.8); padding: 10px 15px; border-radius: 15px; width: 380px; border: 2px solid #39FF14; margin-top: 5px; }
        .leaderboard-container ol { margin: 5px 0 0 0; padding-left: 25px; line-height: 1.4; font-size: 17px; }
        
        .store-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 95%; height: 75%; padding: 10px; overflow-y: auto; }
        .char-card { background: #1A1A2D; border: 3px solid #555; border-radius: 15px; padding: 12px; text-align: center; transition: 0.2s; position: relative; }
        .char-card.owned { border-color: #00E5FF; }
        .char-card.equipped { border-color: #FFD700; background: #2A2A4D; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .char-icon { font-size: 40px; margin-bottom: 2px; }
        .char-name { font-size: 17px; color: #00E5FF; margin-bottom: 2px; }
        .frag-count { font-size: 13px; color: #39FF14; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 2px 8px; display: inline-block; margin-bottom: 8px; }
        .char-bonus { font-size: 13px; color: #FF9933; margin-bottom: 8px; height: 35px; font-weight: bold; line-height: 1.2; word-break: keep-all; }
        .buy-btn { padding: 8px 10px; border-radius: 20px; border: none; cursor: pointer; font-family: 'Jua'; font-size: 15px; width: 100%; margin-bottom: 4px; }
        .can-buy { background: #00E5FF; color: #000; box-shadow: 0 3px 0 #0099AA; }
        .can-equip { background: #FFD700; color: #000; box-shadow: 0 3px 0 #AA8800; }
        .is-equipped { background: #FF3366; color: #FFF; border: 2px solid #FFF; pointer-events: none; }
        
        #levelUpScreen { display: none; z-index: 20; background-color: rgba(13, 13, 26, 0.98); }
        .upgrade-card { background: linear-gradient(135deg, #2A2A4D, #1A1A2D); border: 3px solid #00E5FF; border-radius: 20px; width: 230px; padding: 20px 10px; cursor: pointer; text-align: center; }
        .upgrade-title { font-size: 22px; color: #00E5FF; margin-bottom: 10px; }
        .upgrade-desc { font-size: 13px; color: #FFD700; font-family: 'Malgun Gothic', sans-serif; font-weight: bold; word-break: keep-all; line-height: 1.4; }

        .ranking-list-box { width: 85%; height: 65%; background: rgba(42, 42, 77, 0.8); border: 2px solid #FFD700; border-radius: 15px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .ranking-list-box ol { font-size: 20px; line-height: 1.8; margin: 0; padding-left: 20px; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1A1A2D; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: #00E5FF; border-radius: 5px; }
        
        #quitGameBtn { position: absolute; bottom: 15px; left: 15px; z-index: 15; font-size: 16px; padding: 8px 15px; background: linear-gradient(45deg, #FF3366, #CC0000); box-shadow: 0 4px 0 #990000; border-radius: 20px; font-family: 'Jua'; display: none; }
        #quitGameBtn:active { transform: translateY(4px); box-shadow: 0 0px 0 #990000; }
    </style>
</head>
<body>

<div id="gameContainer" style="position: relative; width: 800px; height: 600px;">
    <button id="quitGameBtn" class="main-btn">🚪 그만하기</button>

    <div id="homeScreen" class="screen-overlay">
        <h1>59서바이벌</h1>
        <div class="season-badge">✨ 난이도 선택 업데이트 ✨</div>
        <div style="color:#aaa; font-size:14px; margin-bottom:8px;">※ 닉네임을 입력하면 자동 저장됩니다.</div>
        <input type="text" id="nicknameInput" placeholder="닉네임(아이디) 입력" maxlength="8">
        
        <div class="control-select">
            <label><input type="radio" name="difficultyMode" value="normal"> <span>🟢 노말 모드 (기본)</span></label>
            <label><input type="radio" name="difficultyMode" value="hard" checked> <span>🔥 하드 모드 (NEW!)</span></label>
        </div>
        
        <div class="control-select" style="margin-top:0;">
            <label><input type="radio" name="controlMode" value="keyboard" checked> <span>⌨️ 키보드</span></label>
            <label><input type="radio" name="controlMode" value="mouse"> <span>🖱️ 마우스</span></label>
        </div>
        
        <div class="action-buttons">
            <button id="startBtn" class="main-btn">게임 시작!</button>
            <button id="openStoreBtn" class="main-btn store-btn">캐릭터 상점</button>
            <button id="rankingBtn" class="main-btn ranking-btn">전체 랭킹</button>
        </div>
        <div class="leaderboard-container">
            <div id="homeLbTitle" style="text-align: center; color: #39FF14; font-size: 18px; margin-bottom: 5px;">🏆 하드 모드 명예의 전당 🏆</div>
            <ol id="homeLeaderboard"></ol>
        </div>
    </div>

    <div id="rankingScreen" class="screen-overlay" style="display: none;">
        <h1 id="fullLbTitle" style="color: #FFD700; font-size: 45px; margin-bottom: 15px;">🏆 명예의 전당 🏆</h1>
        <div class="ranking-list-box">
            <ol id="fullLeaderboard"></ol>
        </div>
        <button id="closeRankingBtn" class="main-btn">홈으로 돌아가기</button>
    </div>

    <div id="storeScreen" class="screen-overlay" style="display: none;">
        <h1 style="color: #39FF14; font-size: 35px; margin-bottom: 5px; margin-top:0;">퍼즐 조각 상점</h1>
        <div style="color:#aaa; margin-bottom:10px;">게임을 플레이하여 조각을 모으고 캐릭터를 영입/강화하세요!</div>
        <div class="store-grid" id="storeGrid"></div>
        <button id="closeStoreBtn" class="main-btn" style="margin-top: 10px; padding: 10px 40px;">나가기</button>
    </div>

    <div id="gameOverScreen" class="screen-overlay" style="display: none;">
        <h1 style="color: #FF3366;">GAME OVER</h1>
        <h2 id="finalScoreText" style="color: #FFD700; font-size: 40px; margin: 10px 0;">0점</h2>
        <div id="earnedFragmentsText" style="min-height: 50px;"></div>
        <button id="restartBtn" class="main-btn" style="margin-top: 20px;">홈으로</button>
    </div>

    <div id="levelUpScreen" class="screen-overlay">
        <h2 id="levelUpTitle" style="color: #FFD700; font-size: 40px; margin-bottom: 10px;">🌟 능력 강화!</h2>
        <div id="currentStatsDisplay"></div>
        <div class="options-container" id="optionsContainer" style="display: flex; gap: 15px;"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCoE_zHR_N33dkYa0AFgyp-ACfFN62ld9U",
        authDomain: "surv-6deb0.firebaseapp.com",
        projectId: "surv-6deb0",
        storageBucket: "surv-6deb0.firebasestorage.app",
        messagingSenderId: "942408627760",
        appId: "1:942408627760:web:7f0f1586dab44e39a31ff5"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const screens = { home: document.getElementById('homeScreen'), gameOver: document.getElementById('gameOverScreen'), levelUp: document.getElementById('levelUpScreen'), store: document.getElementById('storeScreen'), ranking: document.getElementById('rankingScreen') };
    const quitBtn = document.getElementById('quitGameBtn');
    
    let charFragments = { dog: 0, cat: 0, rabbit: 0, bear: 0, chick: 0, wolf: 0 };
    let unlockedChars = { 'basic': 1 };
    let equippedCharId = 'basic';
    let currentNickname = ""; 
    
    let leaderboardsNormal = []; 
    let leaderboardsHard = []; 

    const savedNickname = localStorage.getItem('vamp_last_nickname_s2');
    if (savedNickname) {
        document.getElementById('nicknameInput').value = savedNickname;
    }

    const CHARACTERS = [
        { id: 'basic', icon: '😊', name: '근본 스마일', desc: '기초 지급 캐릭터' },
        { id: 'dog', icon: '🐶', name: '공격 강아지', desc: '확률로 공격력 증가량 2배!' },
        { id: 'cat', icon: '🐱', name: '속사 고양이', desc: '확률로 공격속도 효율 2배!' },
        { id: 'rabbit', icon: '🐰', name: '광속 토끼', desc: '확률로 이동속도 증가량 2배!' },
        { id: 'bear', icon: '🐻', name: '탱커 곰', desc: '확률로 체력증가 효율 2.5배!' },
        { id: 'chick', icon: '🐤', name: '다포 병아리', desc: '확률로 다중발사 증가량 2배!' },
        { id: 'wolf', icon: '🐺', name: '칼날 늑대', desc: '확률로 수호의검 증가량 2배!' }
    ];

    let isPlaying = false, isPaused = false, animationFrameId;
    let score = 0, level = 1, exp = 0, maxExp = 12; 
    let lastTime = 0, attackTimer = 0, enemyTimer = 0, itemTimer = 0;
    let shakeAmount = 0, damageFlash = 0, particles = [], items = [], projectiles = [], enemies = [];
    let dangerZones = [], blackHoles = []; 
    let enemyProjectiles = [], enemyUltEffects = [], enemyBlackHoles = [];
    let player, weapons;
    
    let targetX = 400, targetY = 300;
    let currentControlType = 'keyboard';
    let currentDifficulty = 'hard'; // 기본 하드 모드
    
    let ultEffects = [];
    let selectedUlt = null;
    let ultGauge = 0;
    let ultMax = 200; 
    let activeUltTimer = 0;
    let activeUltData = {};
    let ultFlash = 0;
    let ultStats = { gaugeLevel: 0, damageLevel: 0, sizeLevel: 0 };

    const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'pentagon'];
    const COLORS = ['#FF3366', '#00E5FF', '#39FF14', '#FFD700', '#B026FF'];
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', (e) => { 
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true; 
        
        if (e.key === 'Escape' && isPlaying) {
            if (screens.levelUp.style.display !== 'flex') {
                isPaused = true;
                if (confirm("게임을 끝내시겠습니까?\n현재까지의 점수와 보상이 기록됩니다.")) {
                    gameOver();
                } else {
                    isPaused = false;
                    lastTime = performance.now(); 
                }
            }
        }
    });
    
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
    
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;
    });

    quitBtn.onclick = () => {
        if (isPlaying && !isPaused) {
            isPaused = true;
            if (confirm("게임을 끝내시겠습니까?\n현재까지의 점수와 보상이 기록됩니다.")) {
                gameOver();
            } else {
                isPaused = false;
                lastTime = performance.now(); 
            }
        }
    };

    // 🏆 노말 모드와 하드 모드 랭킹을 각각 불러옴
    function initLeaderboard() {
        if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에")) {
            // 노말 모드 (시즌 1)
            db.collection("scores_5_9").orderBy("score", "desc").limit(100).onSnapshot((snap) => {
                leaderboardsNormal = [];
                snap.forEach((doc) => leaderboardsNormal.push({ id: doc.id, ...doc.data() }));
                updateHomeUI();
            });
            // 하드 모드 (시즌 2)
            db.collection("scores_s2").orderBy("score", "desc").limit(100).onSnapshot((snap) => {
                leaderboardsHard = [];
                snap.forEach((doc) => leaderboardsHard.push({ id: doc.id, ...doc.data() }));
                updateHomeUI();
            });
        }
    }
    initLeaderboard();

    // 난이도 라디오 버튼 바꿀 때마다 랭킹 UI 업데이트
    document.querySelectorAll('input[name="difficultyMode"]').forEach(radio => {
        radio.addEventListener('change', updateHomeUI);
    });

    async function syncUserData(nickname) {
        if (!nickname) return;
        try {
            const doc = await db.collection("users_s2").doc(nickname).get();
            if (doc.exists) {
                const data = doc.data();
                charFragments = data.fragments || { dog: 0, cat: 0, rabbit: 0, bear: 0, chick: 0, wolf: 0 };
                unlockedChars = data.chars || { 'basic': 1 };
                equippedCharId = data.equipped || 'basic';
            } else {
                charFragments = { dog: 0, cat: 0, rabbit: 0, bear: 0, chick: 0, wolf: 0 };
                unlockedChars = { 'basic': 1 };
                equippedCharId = 'basic';
                saveUserData(nickname); 
            }
        } catch (e) {
            console.error("데이터 불러오기 실패:", e);
        }
    }

    function saveUserData(nickname = currentNickname) {
        if (!nickname) return;
        db.collection("users_s2").doc(nickname).set({
            fragments: charFragments,
            chars: unlockedChars,
            equipped: equippedCharId,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("저장 실패:", err));
    }

    function initGameStats() {
        player = { x: 400, y: 300, radius: 20, speed: 2.8, color: '#00E5FF', hp: 100, maxHp: 100, icon: '😊', evasion: 0, evasionLevel: 0 };
        weapons = { damage: 1, fireRate: 400, multiShot: 1, pierce: 0, projSize: 7, orbitals: 0, orbitalAngle: 0, bossDamageMult: 1.0 };
        const char = CHARACTERS.find(c => c.id === equippedCharId);
        player.icon = char.icon;
        projectiles = []; enemies = []; particles = []; items = []; ultEffects = []; dangerZones = []; blackHoles = [];
        enemyProjectiles = []; enemyUltEffects = []; enemyBlackHoles = [];
        
        score = 0; level = 1; exp = 0; maxExp = Math.floor((10 + (level * level * 2)) * 1.05);
        attackTimer = 0; enemyTimer = 0; itemTimer = 0; lastTime = performance.now();
        targetX = player.x; targetY = player.y;
        
        selectedUlt = null; ultGauge = 0; activeUltTimer = 0; activeUltData = {}; ultFlash = 0;
        ultStats = { gaugeLevel: 0, damageLevel: 0, sizeLevel: 0 }; 
        ultMax = 200; 
        isPaused = false; }

    function addUltGauge(amount) {
        if (selectedUlt && selectedUlt !== 'pending' && activeUltTimer <= 0 && ultEffects.length === 0) {
            ultGauge += amount;
            if (ultGauge >= ultMax) {
                ultGauge = 0;
                triggerUltimate();
            }
        }
    }

    function triggerUltimate() {
        if (selectedUlt === 'bomb') {
            ultEffects.push({ type: 'bomb', x: player.x, y: player.y, timer: 2000, maxTimer: 2000 });
        } else if (selectedUlt === 'flame') {
            activeUltTimer = 2500; activeUltData = { angle: 0 };
        } else if (selectedUlt === 'meteor') {
            activeUltTimer = 1500; activeUltData = { drops: 4, timer: 0 }; 
        }
    }

    function triggerBlackHole() {
        blackHoles.push({ x: Math.random() * 600 + 100, y: Math.random() * 400 + 100, radius: 200, duration: 5000, pullStrength: 2.5, tickDamage: 0.8 });
    }

    function renderModalOptions(choices) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        choices.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'upgrade-card';
            card.innerHTML = `<div style="font-size:45px">${opt.icon}</div><div class="upgrade-title">${opt.title}</div><div class="upgrade-desc">${opt.desc}</div>`;
            card.onclick = () => { 
                opt.apply(); 
                document.getElementById('levelUpTitle').innerText = '🌟 능력 강화!';
                screens.levelUp.style.display = 'none'; 
                lastTime = performance.now(); 
                isPaused = false; targetX = player.x; targetY = player.y; 
                checkLevelUp(); 
            };
            container.appendChild(card);
        });
    }

    function triggerUltSelectModal() {
        isPaused = true; screens.levelUp.style.display = 'flex';
        document.getElementById('levelUpTitle').innerText = '🔥 5레벨 보스 처치! 필살기 선택 🔥';
        document.getElementById('currentStatsDisplay').innerHTML = ''; 
        const choices = [
            { id: 'bomb', icon: '💣', title: '오구 폭탄', desc: '설치 후 2초 뒤 폭발하여 화면 전체를 폭격합니다. (광역 3 피해)', apply() { selectedUlt = 'bomb'; ultMax = 200; } },
            { id: 'flame', icon: '🔥', title: '불꽃 방사', desc: '2.5초간 거대한 불꽃을 뿜어냅니다.', apply() { selectedUlt = 'flame'; ultMax = 200; } },
            { id: 'meteor', icon: '🌠', title: '메테오', desc: '무작위 적을 향해 별똥별 4발을 떨어뜨립니다. (발당 5 피해)', apply() { selectedUlt = 'meteor'; ultMax = 200; } }
        ];
        renderModalOptions(choices);
    }

    function triggerUltUpgradeModal() {
        isPaused = true; screens.levelUp.style.display = 'flex';
        document.getElementById('levelUpTitle').innerText = '🔥 보스 처치! 필살기 강화 🔥';
        document.getElementById('currentStatsDisplay').innerHTML = ''; 
        
        let curDmg = 0, nextDmg = 0;
        if (selectedUlt === 'bomb') { curDmg = 3 + ultStats.damageLevel * 3; nextDmg = curDmg + 3; }
        else if (selectedUlt === 'flame') { curDmg = (0.1 + ultStats.damageLevel * 0.1).toFixed(2); nextDmg = (0.1 + (ultStats.damageLevel+1) * 0.1).toFixed(2); }
        else if (selectedUlt === 'meteor') { curDmg = 5 + ultStats.damageLevel * 5; nextDmg = curDmg + 5; }

        let curGauge = Math.max(50, 200 - ultStats.gaugeLevel * 30);
        let nextGauge = Math.max(50, 200 - (ultStats.gaugeLevel + 1) * 30);

        const choices = [
            { id: 'gauge', icon: '⚡', title: '게이지 감소', desc: `발동 요구량: ${curGauge} ➔ ${nextGauge}`, apply() { ultStats.gaugeLevel++; ultMax = Math.max(50, 200 - ultStats.gaugeLevel * 30); } },
            { id: 'damage', icon: '💥', title: '위력 증가', desc: `피해량: ${curDmg} ➔ ${nextDmg}`, apply() { ultStats.damageLevel++; } },
            { id: 'size', icon: '📐', title: '범위 확장', desc: `필살기 타격 범위/크기 25% 증가`, apply() { ultStats.sizeLevel++; } }
        ];
        renderModalOptions(choices);
    }

    function triggerLevelUpModal() {
        isPaused = true; screens.levelUp.style.display = 'flex';
        
        let statsHtml = `
            <div style="background: rgba(42, 42, 77, 0.8); border: 2px solid #00E5FF; border-radius: 10px; padding: 15px; font-size: 16px; color: #FFF; width: 680px; text-align: center; margin-bottom: 25px; line-height: 1.8; font-family: 'Jua', sans-serif;">
                <span style="color:#FFD700">⚔️공격력:</span> ${weapons.damage.toFixed(1)} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#00E5FF">⚡연사력:</span> ${(1000/weapons.fireRate).toFixed(1)}/초 &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#39FF14">👟이속:</span> ${player.speed.toFixed(1)} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#FF3366">❤️체력:</span> ${Math.floor(player.hp)}/${player.maxHp} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#00FF99">💨회피율:</span> ${(player.evasion*100).toFixed(0)}% <br>
                <span style="color:#FF9933">✨다중발사:</span> ${weapons.multiShot} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#B026FF">🔄수호의검:</span> ${weapons.orbitals} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#FFFFFF">☄️관통탄:</span> ${weapons.pierce} &nbsp;&nbsp;|&nbsp;&nbsp;
                <span style="color:#FF0000">👹보스피해:</span> +${((weapons.bossDamageMult-1)*100).toFixed(0)}%
            </div>
        `;
        document.getElementById('currentStatsDisplay').innerHTML = statsHtml;
        
        const eqLvl = unlockedChars[equippedCharId] || 1;
        const upgradeChance = equippedCharId !== 'basic' ? 0.10 + (eqLvl - 1) * 0.05 : 0;
        
        const isDogLucky = equippedCharId === 'dog' && Math.random() < upgradeChance;
        const isCatLucky = equippedCharId === 'cat' && Math.random() < upgradeChance;
        const isRabbitLucky = equippedCharId === 'rabbit' && Math.random() < upgradeChance;
        const isBearLucky = equippedCharId === 'bear' && Math.random() < upgradeChance;
        const isChickLucky = equippedCharId === 'chick' && Math.random() < upgradeChance;
        const isWolfLucky = equippedCharId === 'wolf' && Math.random() < upgradeChance;

        const currentUpgrades = [
            { id: 1, icon: '🗡️', title: isDogLucky ? '공격력 (대성공!)' : '공격력', val: (isDogLucky ? 2 : 1), get desc() { return `데미지 +${this.val}`; }, apply() { weapons.damage += this.val; } },
            { id: 2, icon: '⚡', title: isCatLucky ? '공격 속도 (대성공!)' : '공격 속도', val: (isCatLucky ? 0.8 : 0.9), get desc() { return `연사력 +${isCatLucky ? '20%' : '10%'}`; }, apply() { weapons.fireRate = Math.max(100, weapons.fireRate * this.val); } },
            { id: 3, icon: '👟', title: isRabbitLucky ? '이동 속도 (대성공!)' : '이동 속도', val: (isRabbitLucky ? 1.2 : 0.6), get desc() { return `속도 +${this.val}`; }, apply() { player.speed += this.val; } },
            { id: 4, icon: '❤️', title: isBearLucky ? '체력 단련 (대성공!)' : '체력 단련', val: (isBearLucky ? 50 : 20), get desc() { return `최대 HP +${this.val}`; }, apply() { player.maxHp += this.val; player.hp = Math.min(player.maxHp, player.hp + this.val); } },
            { id: 5, icon: '✨', title: isChickLucky ? '다중 발사 (대성공!)' : '다중 발사', val: (isChickLucky ? 2 : 1), get desc() { return `탄환 수 +${this.val} (최대 12)`; }, apply() { weapons.multiShot = Math.min(12, weapons.multiShot + this.val); } },
            { id: 6, icon: '🔄', title: isWolfLucky ? '수호의 검 (대성공!)' : '수호의 검', val: (isWolfLucky ? 2 : 1), get desc() { return `검 개수 +${this.val} (최대 10)`; }, apply() { weapons.orbitals = Math.min(10, weapons.orbitals + this.val); } },
            { id: 7, icon: '☄️', title: '관통탄', val: 1, desc: '관통 +1회 (최대 8)', apply() { weapons.pierce = Math.min(8, weapons.pierce + 1); } },
            { id: 8, icon: '👹', title: '거인 사냥꾼', val: 0.5, desc: '보스 피해 +50%', apply() { weapons.bossDamageMult += 0.5; } }
        ];

        if (player.evasionLevel < 5) {
            currentUpgrades.push({ 
                id: 9, icon: '💨', title: '회피 기동', val: 0.1, 
                get desc() { return `회피율 +10% (현재: ${Math.floor(player.evasion*100)}%) / 최대 50%`; }, 
                apply() { player.evasion += 0.1; player.evasionLevel++; } 
            });
        }

        const choices = [...currentUpgrades].sort(() => 0.5 - Math.random()).slice(0, 3);
        renderModalOptions(choices);
    }

    function renderStore() { 
        const grid = document.getElementById('storeGrid'); grid.innerHTML = '';
        CHARACTERS.forEach(char => {
            const charLvl = unlockedChars[char.id] || 0;
            const isOwned = charLvl > 0; 
            const isEquipped = equippedCharId === char.id;
            const frags = charFragments[char.id] || 0;
            
            const card = document.createElement('div'); 
            card.className = `char-card ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
            
            let html = `<div class="char-icon">${char.icon}</div><div class="char-name">${char.name}</div>`;
            
            if (char.id === 'basic') {
                html += `<div class="char-bonus" style="height:35px; margin-top:23px;">${char.desc}</div>`;
                html += isEquipped ? `<button class="buy-btn is-equipped">장착 중</button>` : `<button class="buy-btn can-equip" onclick="equipChar('${char.id}')">장착하기</button>`;
            } else {
                html += `<div class="frag-count">보유 조각: 🧩${frags}개</div>`;
                let chancePct = 10 + (Math.max(1, charLvl) - 1) * 5;
                html += `<div class="char-bonus"><span style="color:#FFF">[Lv.${Math.max(1, charLvl)}]</span> ${chancePct}% ${char.desc}</div>`;
                
                let equipBtn = isOwned ? (isEquipped ? `<button class="buy-btn is-equipped" style="margin-bottom:6px;">장착 중</button>` : `<button class="buy-btn can-equip" style="margin-bottom:6px;" onclick="equipChar('${char.id}')">장착하기</button>`) : '';
                html += equipBtn;

                let reqCost = (charLvl + 1) * 5; 
                let canUpgrade = frags >= reqCost;
                
                if (charLvl < 10) {
                    let btnClass = canUpgrade ? 'can-buy' : '';
                    let disabled = canUpgrade ? '' : 'disabled style="background:#555; color:#ccc;"';
                    let btnText = isOwned ? `Lv.${charLvl+1} 강화 (${frags}/${reqCost})` : `영입하기 (${frags}/${reqCost})`;
                    html += `<button class="buy-btn ${btnClass}" ${disabled} onclick="upgradeChar('${char.id}', ${reqCost})">${btnText}</button>`;
                } else {
                    html += `<button class="buy-btn" style="background:#555; color:#fff;" disabled>MAX LV</button>`;
                }
            }
            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    window.upgradeChar = (id, cost) => {
        if (charFragments[id] >= cost) {
            charFragments[id] -= cost;
            if (!unlockedChars[id]) unlockedChars[id] = 1;
            else unlockedChars[id]++;
            saveUserData();
            renderStore();
        }
    }

    window.equipChar = (id) => { equippedCharId = id; saveUserData(); renderStore(); };
    
    window.deleteRecord = (docId, collectionName) => {
        if (confirm("정말 이 기록을 랭킹에서 영구 삭제하시겠습니까?")) {
            db.collection(collectionName).doc(docId).delete().then(() => {
                alert("기록이 성공적으로 삭제되었습니다!");
            }).catch((error) => {
                console.error("삭제 실패:", error);
                alert("삭제 중 오류가 발생했습니다.");
            });
        }
    };

    function createParticles(x, y, color) { 
        for (let i = 0; i < 8; i++) { particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, size: Math.random()*4+2, color, life: 1.0, decay: 0.02 }); } 
    }
    
    function spawnItem() { 
        const r = Math.random();
        let type = r < 0.3 ? 'heart' : (r < 0.6 ? 'bomb' : 'blackhole'); 
        items.push({ type: type, x: Math.random()*700+50, y: Math.random()*500+50, radius: 15, pulse: 0 }); 
    }
    function useBombItem() { 
        if (enemies.length === 0) return; 
        const targetColor = COLORS[Math.floor(Math.random() * COLORS.length)]; 
        for (let i = enemies.length - 1; i >= 0; i--) { 
            if (enemies[i].color === targetColor && !enemies[i].isBoss && !enemies[i].isElite) { 
                const e = enemies[i]; 
                
                // 🔥 점수 획득 공식 (노말은 1/3, 하드는 100%)
                let points = currentDifficulty === 'hard' ? e.maxHp : Math.ceil(e.maxHp / 3);
                score += points; 
                exp += e.maxHp; // 경험치는 동일하게
                
                createParticles(e.x, e.y, e.color); enemies.splice(i, 1); 
            } 
        } 
        shakeAmount = 15; 
    }

    function spawnEnemy(isBoss = false) {
        let x, y;
        if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -50 : canvas.width + 50; y = Math.random() * canvas.height; } 
        else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -50 : canvas.height + 50; }
        
        let hellScale = currentDifficulty === 'hard' && level > 25 ? Math.pow(1.08, level - 25) : 1;

        if (isBoss) {
            const isEliteBoss = level % 10 === 0; 
            let totalHp = Math.floor((isEliteBoss ? level * 16 : level * 9) * hellScale);
            
            // 🔥 노말 모드 보스는 체력 70% 너프
            if (currentDifficulty === 'normal') {
                totalHp = Math.floor(totalHp * 0.7);
            }

            const bSpeed = isEliteBoss ? 1.4 : 0.9;
            enemies.push({ 
                x, y, size: isEliteBoss ? 45 : 35, shape: 'square', color: '#2D00F7', 
                shield: totalHp - 8, hp: 8, maxHp: totalHp, speed: bSpeed, baseSpeed: bSpeed, 
                isBoss: true, bossLevel: level, invuln: 0, patternState: 'normal', patternTimer: 5000,
                berserk: false, berserkUsed: false 
            });
        } else {
            let currentElites = enemies.filter(e => e.isElite).length;
            
            // 🔥 노말 모드에서는 엘리트 등장 안함
            let isElite = false;
            if (currentDifficulty === 'hard') {
                isElite = level > 5 && currentElites < 5 && Math.random() < Math.min(0.15, 0.02 + (level - 5) * 0.005);
            }
            
            if (isElite) {
                let types = ['charger', 'mage', 'glutton'];
                if (level >= 20) types.push('bomber', 'flamer', 'meteor', 'void');
                
                const eType = types[Math.floor(Math.random() * types.length)];
                const totalHp = Math.floor(level * 7.5 * hellScale); 
                
                const eColor = eType === 'charger' ? '#FFFFFF' : 
                             (eType === 'mage' ? '#000000' : 
                             (eType === 'glutton' ? 'rainbow' : 
                             (eType === 'bomber' ? '#FF6600' : 
                             (eType === 'flamer' ? '#FF0000' : 
                             (eType === 'meteor' ? '#9900FF' : '#330000'))))); 
                
                enemies.push({
                    x, y, size: 25, shape: (eType==='charger' ? 'triangle' : eType==='mage' ? 'square' : 'circle'), 
                    color: eColor, 
                    shield: totalHp - 8, hp: 8, maxHp: totalHp, speed: 1.2, isBoss: false, isElite: true, eliteType: eType,
                    actionTimer: 2000, subState: (eType==='charger' ? 'aim' : '')
                });
            } else {
                let hp = (level <= 5) ? Math.floor(Math.random() * 3) + 1 : Math.floor((Math.random() * (2 + level * 1.8)) * hellScale) + 1;
                let baseSpeed = 0.8 * Math.pow(1.02, Math.min(level, 50)); 
                enemies.push({ x, y, size: 16, shape: SHAPES[Math.floor(Math.random() * SHAPES.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)], hp, maxHp: hp, speed: baseSpeed + Math.random() * 0.4, isBoss: false, invuln: 0 });
            }
        }
    }

    function handleEnemyDeath(e, index, array) {
        // 🔥 점수 획득 공식 (노말은 1/3, 하드는 100%)
        let points = currentDifficulty === 'hard' ? e.maxHp : Math.ceil(e.maxHp / 3);
        score += points; 
        exp += e.maxHp; 

        if (e.color === 'rainbow') createParticles(e.x, e.y, `hsl(${Date.now() % 360}, 100%, 50%)`);
        else createParticles(e.x, e.y, e.color); 
        
        let wasBoss = e.isBoss; array.splice(index, 1); 
        
        if (wasBoss) {
            if (!selectedUlt || selectedUlt === 'pending') {
                selectedUlt = 'pending'; triggerUltSelectModal();
            } else {
                triggerUltUpgradeModal();
            }
        } else {
            checkLevelUp();
        }
    }

    function update(deltaTime) {
        if (isPaused || !isPlaying) return;
        itemTimer += deltaTime; if (itemTimer > 15000) { spawnItem(); itemTimer = 0; }
        enemyTimer += deltaTime;

        const MAX_ENEMIES = 120; 
        let spawnDelay = Math.floor(((level <= 5) ? 650 : Math.max(300, 1100 - (level * 60))) / 1.5);
        
        if (enemyTimer > spawnDelay && enemies.length < MAX_ENEMIES) { 
            spawnEnemy(); 
            enemyTimer = 0; 
        }
        
        for (let i = blackHoles.length - 1; i >= 0; i--) {
            blackHoles[i].duration -= deltaTime;
            if (blackHoles[i].duration <= 0) blackHoles.splice(i, 1);
        }

        for (let i = dangerZones.length - 1; i >= 0; i--) {
            let dz = dangerZones[i];
            dz.timer -= deltaTime;
            if (dz.timer <= 0) {
                createParticles(dz.x, dz.y, '#9900FF');
                shakeAmount = 8;
                if (Math.hypot(player.x - dz.x, player.y - dz.y) < dz.radius + player.radius) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= 20; damageFlash = 0.4;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    } else {
                        createParticles(player.x, player.y, '#FFF'); 
                    }
                }
                dangerZones.splice(i, 1);
            }
        }

        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let ep = enemyProjectiles[i];
            ep.x += ep.vx; ep.y += ep.vy;
            if (Math.hypot(player.x - ep.x, player.y - ep.y) < player.radius + ep.radius) {
                if (Math.random() >= player.evasion) {
                    player.hp -= ep.damage; damageFlash = 0.4; shakeAmount = 8;
                    if (player.hp <= 0) { player.hp = 0; gameOver(); }
                } else { 
                    createParticles(player.x, player.y, '#FFF'); 
                }
                enemyProjectiles.splice(i, 1);
                continue;
            }
            if (ep.x < -50 || ep.x > canvas.width + 50 || ep.y < -50 || ep.y > canvas.height + 50) enemyProjectiles.splice(i, 1);
        }

        for (let i = enemyUltEffects.length - 1; i >= 0; i--) {
            let eff = enemyUltEffects[i];
            eff.progress += 0.03 * (deltaTime/16);
            if (eff.progress >= 1.0) {
                shakeAmount = 15;
                for(let k=0; k<20; k++) createParticles(eff.targetX, eff.targetY, '#9900FF');
                if (Math.hypot(eff.targetX - player.x, eff.targetY - player.y) < 80 + player.radius) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= eff.damage; damageFlash = 0.4; shakeAmount = 15;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    } else { 
                        createParticles(player.x, player.y, '#FFF'); 
                    }
                }
                enemyUltEffects.splice(i, 1);
            }
        }

        for (let i = enemyBlackHoles.length - 1; i >= 0; i--) {
            let bh = enemyBlackHoles[i];
            bh.duration -= deltaTime;
            if (bh.duration <= 0) { enemyBlackHoles.splice(i, 1); continue; }
            const dist = Math.hypot(bh.x - player.x, bh.y - player.y);
            if (dist < bh.radius) {
                const a = Math.atan2(bh.y - player.y, bh.x - player.x);
                player.x += Math.cos(a) * bh.pullStrength;
                player.y += Math.sin(a) * bh.pullStrength;
                if (dist < 40) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= bh.tickDamage; damageFlash = 0.1;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    }
                }
            }
        }

        let sizeMod = 1.0 + (ultStats.sizeLevel * 0.25); 

        if (activeUltTimer > 0) {
            activeUltTimer -= deltaTime;
            if (selectedUlt === 'flame') {
                activeUltData.angle += 0.15;
                for(let k=0; k<3; k++) {
                    const a = activeUltData.angle + (Math.PI*2/3)*k;
                    particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*7*sizeMod, vy: Math.sin(a)*7*sizeMod, size: (Math.random()*15+10)*sizeMod, color: (Math.random()>0.5 ? '#FF3300' : '#FF9900'), life: 1.0, decay: 0.04 });
                }
                enemies.forEach(e => {
                    if (Math.hypot(player.x - e.x, player.y - e.y) < 150 * sizeMod) {
                        const isInvincible = e.isBoss && e.patternState === 'enraged';
                        if (!isInvincible) {
                            let dmg = (0.1 + (ultStats.damageLevel * 0.1)) * (deltaTime/16); 
                            if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                            else { e.hp -= dmg; }
                        }
                        const angle = Math.atan2(e.y - player.y, e.x - player.x);
                        e.x += Math.cos(angle) * 1.5; e.y += Math.sin(angle) * 1.5;
                    }
                });
            } else if (selectedUlt === 'meteor') {
                activeUltData.timer -= deltaTime;
                if (activeUltData.timer <= 0 && activeUltData.drops > 0) {
                    activeUltData.drops--; activeUltData.timer = 300; 
                    if (enemies.length > 0) {
                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        ultEffects.push({ type: 'meteor', startX: target.x + 200, startY: target.y - 400, targetX: target.x, targetY: target.y, progress: 0 });
                    }
                }
            }
        }

        for (let i = ultEffects.length - 1; i >= 0; i--) {
            let eff = ultEffects[i];
            if (eff.type === 'bomb') {
                eff.timer -= deltaTime;
                if (eff.timer <= 0) {
                    shakeAmount = 30; ultFlash = 1.0;
                    enemies.forEach(e => {
                        if (Math.hypot(eff.x - e.x, eff.y - e.y) < 400 * sizeMod) {
                            const isInvincible = e.isBoss && e.patternState === 'enraged';
                            if (!isInvincible) {
                                let dmg = 3 + (ultStats.damageLevel * 3); 
                                if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                                else { e.hp -= dmg; }
                            }
                        }
                    });
                    for(let k=0; k<30; k++) createParticles(eff.x + (Math.random()-0.5)*200*sizeMod, eff.y + (Math.random()-0.5)*200*sizeMod, '#FFF');
                    ultEffects.splice(i, 1);
                }
            } else if (eff.type === 'meteor') {
                eff.progress += 0.04 * (deltaTime/16); 
                const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
                const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
                particles.push({x: curX, y: curY, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, size: Math.random()*8+4, color: '#FFD700', life: 1.0, decay: 0.05});

                if (eff.progress >= 1.0) {
                    shakeAmount = 15;
                    for(let k=0; k<20; k++) createParticles(eff.targetX, eff.targetY, '#FF3366');
                    enemies.forEach(e => {
                        if (Math.hypot(eff.targetX - e.x, eff.targetY - e.y) < 120 * sizeMod) {
                            const isInvincible = e.isBoss && e.patternState === 'enraged';
                            if (!isInvincible) {
                                let dmg = 5 + (ultStats.damageLevel * 5); 
                                if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                                else { e.hp -= dmg; }
                            }
                        }
                    });
                    ultEffects.splice(i, 1);
                }
            }
        }

        if (ultFlash > 0) ultFlash -= 0.02;

        attackTimer += deltaTime;
        if (attackTimer > weapons.fireRate) { 
            if (enemies.length > 0) {
                let nearest = enemies[0], minDist = Math.hypot(player.x - enemies[0].x, player.y - enemies[0].y);
                enemies.forEach(e => { const d = Math.hypot(player.x - e.x, player.y - e.y); if (d < minDist) { minDist = d; nearest = e; } });
                const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                for(let i=0; i<weapons.multiShot; i++) {
                    const angle = baseAngle - (0.2 * (weapons.multiShot - 1)) / 2 + (i * 0.2);
                    projectiles.push({ x: player.x, y: player.y, radius: weapons.projSize, color: '#FFF500', velocity: { x: Math.cos(angle) * 8, y: Math.sin(angle) * 8 }, damage: weapons.damage, pierce: weapons.pierce, hitIds: new Set() });
                }
            }
            attackTimer = 0; 
        }
        weapons.orbitalAngle += 0.05;

        if (currentControlType === 'keyboard') {
            if ((keys.ArrowUp || keys.w) && player.y > 20) player.y -= player.speed;
            if ((keys.ArrowDown || keys.s) && player.y < canvas.height - 20) player.y += player.speed;
            if ((keys.ArrowLeft || keys.a) && player.x > 20) player.x -= player.speed;
            if ((keys.ArrowRight || keys.d) && player.x < canvas.width - 20) player.x += player.speed;
            targetX = player.x; targetY = player.y; 
        } 
        else if (currentControlType === 'mouse') {
            const dist = Math.hypot(targetX - player.x, targetY - player.y);
            if (dist > player.speed) {
                player.x += (targetX - player.x) / dist * player.speed;
                player.y += (targetY - player.y) / dist * player.speed;
            }
        }
        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
        player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= (p.decay || 0.02);
            if (p.life <= 0) particles.splice(i, 1);
        }
        
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.pulse += 0.1; 
            if(Math.hypot(player.x-item.x, player.y-item.y) < player.radius+item.radius) { 
                if (item.type === 'heart') {
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                    createParticles(player.x, player.y, '#FF3366');
                } else if (item.type === 'bomb') {
                    useBombItem(); 
                } else if (item.type === 'blackhole') {
                    triggerBlackHole();
                }
                items.splice(i, 1); 
            } 
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i]; p.x += p.velocity.x; p.y += p.velocity.y;
            if (p.x < -50 || p.x > canvas.width + 50 || p.y < -50 || p.y > canvas.height + 50) { projectiles.splice(i, 1); continue; }
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (!p.hitIds.has(e) && Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.size) {
                    p.hitIds.add(e); 
                    const isInvincible = e.isBoss && e.patternState === 'enraged';
                    
                    if (!isInvincible) {
                        let dmg = p.damage * (e.isBoss ? weapons.bossDamageMult : 1);
                        if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } else e.hp -= dmg;
                        
                        addUltGauge(dmg); 
                        
                        if (e.hp <= 0) { 
                            // 🔥 하드 모드 보스는 20레벨 발광
                            if (currentDifficulty === 'hard' && e.isBoss && e.bossLevel >= 20 && !e.berserkUsed) {
                                e.hp = 1; e.berserk = true; e.berserkUsed = true; e.berserkTimer = 6000; e.shield = 0;
                            } else {
                                handleEnemyDeath(e, j, enemies); break; 
                            }
                        }
                    }
                    if (p.pierce <= 0) { projectiles.splice(i, 1); break; } else p.pierce -= 1;
                }
            }
        }
        
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i]; 
            
            if (e.isBoss) {
                if (currentDifficulty === 'hard' && e.berserk) {
                    e.berserkTimer -= deltaTime;
                    e.patternState = 'enraged'; 
                    e.speed = e.baseSpeed * 3.5; 
                    createParticles(e.x + (Math.random()-0.5)*e.size, e.y + (Math.random()-0.5)*e.size, '#FF0000'); 
                    
                    if (e.berserkTimer <= 0) {
                        e.berserk = false; e.hp = 0;
                        handleEnemyDeath(e, i, enemies);
                        continue;
                    }
                } else {
                    e.patternTimer -= deltaTime;
                    if (e.patternTimer <= 0) {
                        // 🔥 노말은 무적패턴 지속 짧고 주기 긺
                        let normalDur = (currentDifficulty === 'hard' && e.bossLevel >= 10) ? 3000 : 5000;
                        let enragedDur = (currentDifficulty === 'hard' && e.bossLevel >= 10) ? 3000 : 2000;
                        
                        if (e.patternState === 'normal') {
                            e.patternState = 'enraged';
                            e.patternTimer = enragedDur;
                            e.speed = e.baseSpeed * 2.5;
                        } else {
                            e.patternState = 'normal';
                            e.patternTimer = normalDur;
                            e.speed = e.baseSpeed;
                        }
                    }
                }
            }

            if (e.isElite) {
                if (e.eliteType === 'charger') {
                    if (e.subState === 'aim') {
                        e.actionTimer -= deltaTime;
                        e.angle = Math.atan2(player.y - e.y, player.x - e.x);
                        if (e.actionTimer <= 0) { e.subState = 'dash'; e.actionTimer = 800; } 
                    } else if (e.subState === 'dash') {
                        e.actionTimer -= deltaTime;
                        e.x += Math.cos(e.angle) * e.speed * 4;
                        e.y += Math.sin(e.angle) * e.speed * 4;
                        if (e.actionTimer <= 0) { e.subState = 'aim'; e.actionTimer = 2000; }
                    }
                } else if (e.eliteType === 'mage') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        dangerZones.push({x: player.x, y: player.y, radius: 70, timer: 2000});
                        e.actionTimer = 3500;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    if (dist < 200) { e.x -= Math.cos(angle) * e.speed * 0.8; e.y -= Math.sin(angle) * e.speed * 0.8; } 
                    else { e.x += Math.cos(angle) * e.speed * 0.5; e.y += Math.sin(angle) * e.speed * 0.5; }
                } else if (e.eliteType === 'glutton') {
                    if (items.length > 0) {
                        let nearest = items[0], minDist = Math.hypot(items[0].x - e.x, items[0].y - e.y);
                        items.forEach(it => { let d = Math.hypot(it.x - e.x, it.y - e.y); if(d < minDist) { minDist = d; nearest = it; } });
                        const angle = Math.atan2(nearest.y - e.y, nearest.x - e.x);
                        e.x += Math.cos(angle) * e.speed * 1.8; 
                        e.y += Math.sin(angle) * e.speed * 1.8;
                        if (minDist < e.size + nearest.radius) {
                            items.splice(items.indexOf(nearest), 1);
                            e.shield += 50; e.size = Math.min(e.size + 8, 60); e.speed += 0.2;
                            createParticles(e.x, e.y, '#00FF33');
                        }
                    } else {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                    }
                } 
                else if (e.eliteType === 'flamer') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        for(let k=-2; k<=2; k++) {
                            enemyProjectiles.push({ x: e.x, y: e.y, radius: 6, color: '#FF3300', vx: Math.cos(angle + k*0.2)*5, vy: Math.sin(angle + k*0.2)*5, damage: 10 });
                        }
                        e.actionTimer = 3000;
                    }
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * 0.7; e.y += Math.sin(angle) * e.speed * 0.7;
                } else if (e.eliteType === 'bomber') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        dangerZones.push({x: player.x, y: player.y, radius: 120, timer: 2000}); 
                        e.actionTimer = 4000;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    const angle = Math.atan2(e.y - player.y, e.x - player.x);
                    if (dist < 300) { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed; }
                } else if (e.eliteType === 'meteor') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        enemyUltEffects.push({ type: 'meteor', startX: player.x + 300, startY: player.y - 500, targetX: player.x, targetY: player.y, progress: 0, damage: 20 });
                        e.actionTimer = 3500;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (dist > 400) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                    }
                } else if (e.eliteType === 'void') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        enemyBlackHoles.push({x: e.x, y: e.y, radius: 250, pullStrength: 2.0, tickDamage: 0.5, duration: 4000});
                        e.actionTimer = 6000;
                    }
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * 0.5; e.y += Math.sin(angle) * e.speed * 0.5;
                }
            } else {
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
            }

            blackHoles.forEach(bh => {
                const dist = Math.hypot(bh.x - e.x, bh.y - e.y);
                if (dist < bh.radius) {
                    const a = Math.atan2(bh.y - e.y, bh.x - e.x);
                    e.x += Math.cos(a) * bh.pullStrength;
                    e.y += Math.sin(a) * bh.pullStrength;
                    if (dist < 60) {
                        if (e.shield > 0) { e.shield -= bh.tickDamage; if(e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                        else { e.hp -= bh.tickDamage; }
                    }
                }
            });

            if (weapons.orbitals > 0 && (e.invuln || 0) <= 0) {
                for(let o=0; o<weapons.orbitals; o++) {
                    const ox = player.x + Math.cos(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * 65;
                    const oy = player.y + Math.sin(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * 65;
                    if (Math.hypot(ox - e.x, oy - e.y) < 15 + e.size) {
                        const isInvincible = e.isBoss && e.patternState === 'enraged';
                        if (!isInvincible) {
                            let d = weapons.damage * (e.isBoss ? weapons.bossDamageMult : 1);
                            if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= d; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                            else { e.hp -= d; }
                            addUltGauge(d); 
                        }
                        e.invuln = 500; break;
                    }
                }
            }
            
            if (e.hp <= 0) { 
                if (currentDifficulty === 'hard' && e.isBoss && e.bossLevel >= 20 && !e.berserkUsed) {
                    e.hp = 1; e.berserk = true; e.berserkUsed = true; e.berserkTimer = 6000; e.shield = 0;
                } else {
                    handleEnemyDeath(e, i, enemies); continue; 
                }
            }
            
            if (e.invuln > 0) e.invuln -= deltaTime;
            
            if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.size) {
                let collisionDmg = e.hp;
                if (currentDifficulty === 'hard' && e.berserk) collisionDmg = 20; 
                
                if (Math.random() >= player.evasion) {
                    player.hp -= collisionDmg; damageFlash = 0.4; shakeAmount = 10;
                    if (player.hp <= 0) { player.hp = 0; gameOver(); }
                } else {
                    createParticles(player.x, player.y, '#FFF'); 
                }
                
                if (e.isBoss) { 
                    let nx, ny, d; 
                    do { nx = Math.random()*700+50; ny = Math.random()*500+50; d = Math.hypot(player.x-nx, player.y-ny); } while(d<350); 
                    e.x=nx; e.y=ny; 
                } else {
                    enemies.splice(i, 1);
                }
            }
        }
        if (shakeAmount > 0) shakeAmount *= 0.9; if (damageFlash > 0) damageFlash -= 0.02;
    }

    function checkLevelUp() {
        if (exp >= maxExp && selectedUlt !== 'pending') {
            exp -= maxExp; level++; 
            maxExp = Math.floor((10 + (level * level * 2)) * 1.05);
            if (Math.floor(level / 5) > Math.floor((level - 1) / 5)) spawnEnemy(true);
            triggerLevelUpModal();
        }
    }

    function draw() {
        ctx.save(); if (shakeAmount > 0) ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for (let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); }

        let sizeMod = 1.0 + (ultStats.sizeLevel * 0.25);

        blackHoles.forEach(bh => {
            ctx.save(); ctx.translate(bh.x, bh.y);
            const p = 1 + Math.sin(Date.now() / 200) * 0.1;
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius * p);
            grad.addColorStop(0, 'black'); grad.addColorStop(0.3, '#1a0033'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, bh.radius * p, 0, Math.PI*2); ctx.fill();
            ctx.rotate(Date.now() / 500); ctx.strokeStyle = '#9900FF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 40 * p, 0, Math.PI*1.5); ctx.stroke();
            ctx.restore();
        });

        enemyBlackHoles.forEach(bh => {
            ctx.save(); ctx.translate(bh.x, bh.y);
            const p = 1 + Math.sin(Date.now() / 150) * 0.1;
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius * p);
            grad.addColorStop(0, '#330000'); grad.addColorStop(0.3, '#1a0000'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, bh.radius * p, 0, Math.PI*2); ctx.fill();
            ctx.rotate(-Date.now() / 400); ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 40 * p, 0, Math.PI*1.5); ctx.stroke();
            ctx.restore();
        });

        dangerZones.forEach(dz => {
            ctx.beginPath(); ctx.arc(dz.x, dz.y, dz.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(153, 0, 255, ${0.1 + (1 - Math.max(0, dz.timer)/2000)*0.4})`; 
            ctx.fill();
            ctx.strokeStyle = '#9900FF'; ctx.lineWidth = 2; ctx.stroke();
        });

        enemyProjectiles.forEach(ep => {
            ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI*2);
            ctx.fillStyle = ep.color; ctx.shadowBlur = 10; ctx.shadowColor = ep.color; ctx.fill();
            ctx.shadowBlur = 0;
        });

        enemyUltEffects.forEach(eff => {
            const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
            const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
            ctx.save(); ctx.translate(curX, curY);
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
            ctx.fillStyle = '#9900FF'; ctx.shadowBlur = 20; ctx.shadowColor = '#FF0000'; ctx.fill();
            ctx.restore();
            ctx.beginPath(); ctx.arc(eff.targetX, eff.targetY, 80, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)'; ctx.lineWidth = 2; ctx.stroke();
        });

        enemies.forEach(e => {
            if (e.isElite && e.eliteType === 'charger' && e.subState === 'aim') {
                ctx.beginPath(); ctx.moveTo(e.x, e.y);
                ctx.lineTo(e.x + Math.cos(e.angle)*800, e.y + Math.sin(e.angle)*800);
                ctx.strokeStyle = `rgba(255, 51, 0, ${1 - e.actionTimer/2000})`; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        if (activeUltTimer > 0 && selectedUlt === 'flame') {
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(activeUltData.angle);
            ctx.beginPath(); ctx.arc(0, 0, 150 * sizeMod, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 100, 0, 0.15)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255, 100, 0, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = 'rgba(255, 153, 51, 0.3)';
            ctx.beginPath(); ctx.arc(0, 0, 140 * sizeMod, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FF3366';
            ctx.fillRect(-140 * sizeMod, -10, 280 * sizeMod, 20); ctx.fillRect(-10, -140 * sizeMod, 20, 280 * sizeMod);
            ctx.restore();
        }

        items.forEach(item => {
            ctx.save(); ctx.translate(item.x, item.y); ctx.rotate(item.pulse); 
            ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(item.type === 'heart' ? '💖' : (item.type === 'bomb' ? '💣' : '🌀'), 0, 0);
            ctx.beginPath(); ctx.arc(0, 0, item.radius, 0, Math.PI*2);
            ctx.strokeStyle = item.type === 'heart' ? 'rgba(255, 51, 102, 0.5)' : (item.type === 'bomb' ? 'rgba(0, 229, 255, 0.5)' : 'rgba(153, 0, 255, 0.8)');
            ctx.lineWidth = 3; ctx.stroke();
            ctx.restore();
        });

        projectiles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); });
        
        enemies.forEach(e => {
            ctx.fillStyle = (e.isBoss && e.patternState === 'enraged') ? '#FF0000' : (e.color === 'rainbow' ? `hsl(${Date.now() % 360}, 100%, 50%)` : e.color); 
            ctx.beginPath();
            
            if (e.shape === 'square') ctx.rect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2); 
            else if (e.shape === 'triangle') {
                ctx.moveTo(e.x + Math.cos(e.angle||0)*e.size, e.y + Math.sin(e.angle||0)*e.size);
                ctx.lineTo(e.x + Math.cos((e.angle||0)+2.5)*e.size, e.y + Math.sin((e.angle||0)+2.5)*e.size);
                ctx.lineTo(e.x + Math.cos((e.angle||0)-2.5)*e.size, e.y + Math.sin((e.angle||0)-2.5)*e.size);
                ctx.closePath();
            }
            else ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
            
            ctx.fill(); 
            ctx.lineWidth = e.isElite ? 4 : 3; 
            
            if (e.isElite) {
                ctx.strokeStyle = e.eliteType === 'charger' ? '#FF3300' : (e.eliteType === 'mage' ? '#9900FF' : '#FFFFFF');
            } else {
                ctx.strokeStyle = '#111';
            }
            ctx.stroke();
            
            if (currentDifficulty === 'hard' && e.isBoss && e.berserk) {
                ctx.font = 'bold 20px Jua';
                ctx.fillStyle = '#FF3300';
                ctx.fillText('⚠️발광!⚠️', e.x, e.y - e.size - 25);
                ctx.beginPath(); ctx.arc(e.x, e.y, e.size + 12 + Math.random()*5, 0, Math.PI*2);
                ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 5; ctx.stroke();
            } else if (e.isBoss && e.patternState === 'enraged') {
                ctx.beginPath(); ctx.arc(e.x, e.y, e.size + 8, 0, Math.PI*2);
                ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.stroke();
            }
            
            if (e.isElite) { 
                let symbol = e.eliteType === 'glutton' ? '😋' :
                             (e.eliteType === 'mage' ? '⚡' :
                             (e.eliteType === 'charger' ? '🔥' :
                             (e.eliteType === 'bomber' ? '💣' :
                             (e.eliteType === 'flamer' ? '☄️' :
                             (e.eliteType === 'meteor' ? '🌠' : '🌀'))))); 
                ctx.font = '15px Arial'; ctx.fillText(symbol, e.x, e.y - e.size - 6); 
            }

            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(e.x-7, e.y-5, 5, 0, Math.PI*2); ctx.arc(e.x+7, e.y-5, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(e.x-7, e.y-5, 2, 0, Math.PI*2); ctx.arc(e.x+7, e.y-5, 2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = `bold ${e.isBoss ? 20 : 14}px Jua`; ctx.textAlign = 'center'; 
            
            let hpText = e.berserk ? (e.berserkTimer / 1000).toFixed(1) + "초" : Math.ceil(e.hp + (e.shield || 0));
            ctx.strokeText(hpText, e.x, e.y + e.size + 15); ctx.fillText(hpText, e.x, e.y + e.size + 15);
            
            if ((e.isBoss || e.isElite) && !e.berserk) {
                const bw = e.size * 2.5; 
                const yOff = e.size + (e.isBoss ? 20 : 26);
                ctx.fillStyle = '#2A2A4D'; ctx.fillRect(e.x - bw/2, e.y - yOff, bw, 6);
                const sRatio = Math.max(0, e.shield / (e.maxHp - 8)); 
                ctx.fillStyle = '#00E5FF'; ctx.fillRect(e.x - bw/2, e.y - yOff, bw * sRatio, 6);
            }
        });
        
        ultEffects.forEach(eff => {
            if (eff.type === 'bomb') {
                ctx.save(); ctx.translate(eff.x, eff.y);
                const scale = (1 + Math.sin(Date.now() / 100) * 0.2) * sizeMod; 
                ctx.scale(scale, scale);
                ctx.font = '50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💣', 0, 0);
                ctx.beginPath(); ctx.arc(0, 0, 35, -Math.PI/2, -Math.PI/2 + (eff.timer/eff.maxTimer)*Math.PI*2);
                ctx.lineWidth = 4; ctx.strokeStyle = '#FF3366'; ctx.stroke();
                ctx.restore();
            } else if (eff.type === 'meteor') {
                const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
                const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
                ctx.save(); ctx.translate(curX, curY);
                ctx.beginPath(); ctx.arc(0, 0, 15 * sizeMod, 0, Math.PI*2);
                ctx.fillStyle = '#FFF500'; ctx.shadowBlur = 20; ctx.shadowColor = '#FF3366'; ctx.fill();
                ctx.restore();
                ctx.beginPath(); ctx.arc(eff.targetX, eff.targetY, 120 * sizeMod, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255, 51, 102, 0.4)'; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1.0; });

        if (equippedCharId === 'basic') {
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fillStyle = player.color; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(player.x-6, player.y-3, 5, 0, Math.PI*2); ctx.arc(player.x+6, player.y-3, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(player.x-6, player.y-3, 2.5, 0, Math.PI*2); ctx.arc(player.x+6, player.y-3, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(player.x, player.y + 4, 6, 0, Math.PI, false); ctx.stroke();
        } else {
            ctx.font = '45px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(player.icon, player.x, player.y);
        }

        if (weapons.orbitals > 0) {
            ctx.fillStyle = '#39FF14'; for(let o=0; o<weapons.orbitals; o++) {
                const ox = player.x + Math.cos(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * 70;
                const oy = player.y + Math.sin(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * 70;
                ctx.beginPath(); ctx.arc(ox, oy, 10, 0, Math.PI*2); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
            }
        }
        
        if (selectedUlt && selectedUlt !== 'pending') {
            const gaugeWidth = 40; const gaugeRatio = Math.min(1, ultGauge / ultMax);
            ctx.fillStyle = '#1A1A2D'; ctx.fillRect(player.x - gaugeWidth/2, player.y + 25, gaugeWidth, 6);
            ctx.fillStyle = (activeUltTimer > 0 || ultEffects.length > 0) ? '#FF3366' : '#00E5FF';
            ctx.fillRect(player.x - gaugeWidth/2, player.y + 25, gaugeWidth * gaugeRatio, 6);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(player.x - gaugeWidth/2, player.y + 25, gaugeWidth, 6);
        }

        if (damageFlash > 0) { ctx.fillStyle = `rgba(255, 0, 0, ${damageFlash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        if (ultFlash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${ultFlash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.restore();

        ctx.fillStyle = 'rgba(26, 26, 45, 0.7)'; ctx.fillRect(0, 0, canvas.width, 50);
        ctx.fillStyle = '#00E5FF'; ctx.font = '24px Jua'; ctx.textAlign = 'left'; ctx.fillText(`LV: ${level} (${player.icon})`, 20, 35);
        ctx.textAlign = 'right'; ctx.fillStyle = '#FFD700'; ctx.fillText(`SCORE: ${score}`, canvas.width - 20, 35);
        ctx.fillStyle = '#FF3366'; ctx.textAlign = 'center'; ctx.fillText(`HP: ${Math.floor(player.hp)}`, canvas.width/2, 35);
        ctx.fillStyle = '#2A2A4D'; ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
        ctx.fillStyle = '#39FF14'; ctx.fillRect(0, canvas.height - 15, canvas.width * (exp / maxExp), 15);
    }

    function gameLoop(timestamp) { if (!isPlaying) return; const deltaTime = timestamp - (lastTime || timestamp); lastTime = timestamp; update(deltaTime); draw(); animationFrameId = requestAnimationFrame(gameLoop); }
    
    function gameOver() {
        isPlaying = false; cancelAnimationFrame(animationFrameId);
        quitBtn.style.display = 'none'; 
        
        let earnedHTML = "";
        
        if (level < 5) {
            earnedHTML = "<div style='color:#ccc; font-size:24px; margin-top:10px;'>5레벨 도달 실패... 보상 없음 😢</div><div style='font-size:16px; color:#aaa; margin-top:5px;'>최소 5레벨을 넘겨야 랜덤 조각 상자가 지급됩니다.</div>";
        } else {
            let calcBoxes = 1 + Math.floor(score / 2000);
            let totalBoxes = Math.min(10, calcBoxes);
            
            let fragCounts = {};
            let availableChars = ['dog', 'cat', 'rabbit', 'bear', 'chick', 'wolf'];
            let totalFragmentsGained = 0;

            for(let i=0; i<totalBoxes; i++) {
                let randomChar = availableChars[Math.floor(Math.random() * availableChars.length)];
                let r = Math.random();
                let amount = 1;
                if (r > 0.9) amount = 5; 
                else if (r > 0.7) amount = 2; 
                
                fragCounts[randomChar] = (fragCounts[randomChar] || 0) + amount;
                charFragments[randomChar] = (charFragments[randomChar] || 0) + amount;
                totalFragmentsGained += amount;
            }
            
            earnedHTML = `<div style='font-size:25px; color:#39FF14; margin-top:10px;'>🎁 조각 상자 ${totalBoxes}개 오픈! (총 ${totalFragmentsGained}개 획득) 🎁</div><div style='display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;'>`;
            for(let cId in fragCounts) {
                let cObj = CHARACTERS.find(c => c.id === cId);
                earnedHTML += `<span style="background:#2A2A4D; padding:5px 12px; border-radius:10px; border:2px solid ${COLORS[Math.floor(Math.random()*COLORS.length)]}; font-size:20px;">${cObj.icon} +${fragCounts[cId]}</span>`;
            }
            earnedHTML += "</div>";
            saveUserData();
        }
        
        if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에")) {
            const collectionName = currentDifficulty === 'hard' ? "scores_s2" : "scores_5_9";
            db.collection(collectionName).add({
                name: currentNickname, score: score, level: level, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => console.error("점수 저장 실패:", error));
        }

        screens.gameOver.style.display = 'flex'; canvas.style.display = 'none';
        document.getElementById('finalScoreText').innerText = `${score}점`;
        document.getElementById('earnedFragmentsText').innerHTML = earnedHTML;
    }

    function updateHomeUI() {
        const isAdmin = document.getElementById('nicknameInput').value === '식이쌤관리자';
        const selectedDiff = document.querySelector('input[name="difficultyMode"]:checked').value;
        
        // 난이도에 따른 랭킹판 제목과 데이터 선택
        document.getElementById('homeLbTitle').innerText = selectedDiff === 'hard' ? '🏆 하드 모드 명예의 전당 (Top 5) 🏆' : '🏆 노말 모드 명예의 전당 (Top 5) 🏆';
        document.getElementById('fullLbTitle').innerText = selectedDiff === 'hard' ? '🏆 하드 모드 전체 랭킹 🏆' : '🏆 노말 모드 전체 랭킹 🏆';
        
        const currentLB = selectedDiff === 'hard' ? leaderboardsHard : leaderboardsNormal;
        const collName = selectedDiff === 'hard' ? 'scores_s2' : 'scores_5_9';

        const top5 = currentLB.slice(0, 5);
        const homeHtml = top5.length ? top5.map((e, i) => `
            <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <span>${i + 1}. ${e.name}</span> 
                <div>
                    <span style="color:#FFD700">${e.score}점</span>
                    ${isAdmin && e.id ? `<button onclick="deleteRecord('${e.id}', '${collName}')" style="margin-left:10px; background:#FF3366; color:white; border:none; border-radius:5px; cursor:pointer; font-family:'Jua'; padding:2px 8px;">삭제</button>` : ''}
                </div>
            </li>`).join('') : '<li>기록 없음</li>';
            
        document.getElementById('homeLeaderboard').innerHTML = homeHtml;

        const fullHtml = currentLB.length ? currentLB.map((e, i) => `
            <li style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0;">
                <span><strong style="color:${i<3?'#FF3366':'#00E5FF'}">${i + 1}위.</strong> ${e.name} (Lv.${e.level})</span> 
                <div>
                    <span style="color:#FFD700">${e.score}점</span>
                    ${isAdmin && e.id ? `<button onclick="deleteRecord('${e.id}', '${collName}')" style="margin-left:10px; background:#FF3366; color:white; border:none; border-radius:5px; cursor:pointer; font-family:'Jua'; padding:2px 8px;">삭제</button>` : ''}
                </div>
            </li>`).join('') : '<li>기록 없음</li>';

        const fullLeaderboardEl = document.getElementById('fullLeaderboard');
        if (fullLeaderboardEl) fullLeaderboardEl.innerHTML = fullHtml;
    }

    document.getElementById('nicknameInput').addEventListener('input', (e) => {
        localStorage.setItem('vamp_last_nickname_s2', e.target.value.trim());
        updateHomeUI();
    });

    document.getElementById('startBtn').onclick = async () => { 
        let nick = document.getElementById('nicknameInput').value.trim();
        if (!nick) return alert("❌ 닉네임(아이디)을 먼저 입력해주세요!\n데이터가 클라우드에 자동 저장됩니다.");
        
        currentNickname = nick;
        if (currentNickname === '식이쌤관리자') currentNickname = "관리자";

        const btn = document.getElementById('startBtn');
        const originalText = btn.innerText;
        btn.innerText = "불러오는 중...";
        await syncUserData(currentNickname);
        btn.innerText = originalText;
        
        if (currentNickname === 'test99') { 
            ['dog','cat','rabbit','bear','chick','wolf'].forEach(c => charFragments[c] = (charFragments[c]||0) + 100);
            saveUserData(); 
        }

        const selectedControl = document.querySelector('input[name="controlMode"]:checked');
        if (selectedControl) currentControlType = selectedControl.value;

        // 🔥 난이도 세팅
        const selectedDiff = document.querySelector('input[name="difficultyMode"]:checked');
        if (selectedDiff) currentDifficulty = selectedDiff.value;
        
        screens.home.style.display = 'none'; 
        canvas.style.display = 'block'; 
        quitBtn.style.display = 'block'; 
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        
        initGameStats(); 
        isPlaying = true; 
        requestAnimationFrame(gameLoop); 
    };
    
    document.getElementById('openStoreBtn').onclick = async () => { 
        let nick = document.getElementById('nicknameInput').value.trim();
        if (!nick) return alert("❌ 닉네임(아이디)을 먼저 입력해주세요!\n데이터가 클라우드에 자동 저장됩니다.");
        
        currentNickname = nick;
        if (currentNickname === '식이쌤관리자') currentNickname = "관리자";

        const btn = document.getElementById('openStoreBtn');
        btn.innerText = "불러오는 중...";
        await syncUserData(currentNickname);
        btn.innerText = "캐릭터 상점";

        screens.home.style.display = 'none'; 
        screens.store.style.display = 'flex'; 
        renderStore(); 
    };

    document.getElementById('closeStoreBtn').onclick = () => { screens.store.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };
    
    document.getElementById('rankingBtn').onclick = () => { screens.home.style.display = 'none'; screens.ranking.style.display = 'flex'; updateHomeUI(); };
    document.getElementById('closeRankingBtn').onclick = () => { screens.ranking.style.display = 'none'; screens.home.style.display = 'flex'; };

    document.getElementById('restartBtn').onclick = () => { screens.gameOver.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };

    updateHomeUI();
</script>
</body>
</html>
