name: Deploy Modular Arena to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "modular-arena/**"
      - ".github/workflows/deploy-modular-arena.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: modular-arena/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: modular-arena

      - name: Run unit tests
        run: pnpm test
        working-directory: modular-arena

      - name: Build PWA
        run: pnpm build
        working-directory: modular-arena

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p pages-artifact/modular-arena
          cp index.html pages-artifact/index.html
          cp -R v2 pages-artifact/v2
          cp -R modular-arena/dist/. pages-artifact/modular-arena/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
