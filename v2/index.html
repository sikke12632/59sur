    const CHARACTER_IMAGE_SRC = {
        basic: 'assets/player_basic_neon.png',
        dog: 'assets/player_dog_neon.png',
        cat: 'assets/player_cat_neon.png',
        rabbit: 'assets/player_rabbit_neon.png',
        bear: 'assets/player_bear_neon.png',
        chick: 'assets/player_chick_neon.png',
        wolf: 'assets/player_wolf_neon.png'
    };
    const SPRITES = {};
    Object.keys(CHARACTER_IMAGE_SRC).forEach(id => {
        SPRITES[id] = new Image();
        SPRITES[id].src = CHARACTER_IMAGE_SRC[id];
    });
    function getCharacterSprite(id) {
        const sprite = SPRITES[id];
        return sprite && sprite.complete && sprite.naturalWidth > 0 ? sprite : null;
    }
    function getCharacterThumbHtml(char) {
        const src = CHARACTER_IMAGE_SRC[char.id];
        if (!src) return `<span class="char-emoji-fallback" style="display:inline-block;">${char.icon}</span>`;
        return `<span class="char-emoji-fallback">${char.icon}</span><img src="${src}" alt="${char.name}" onerror="this.style.display='none'; this.previousElementSibling.style.display='inline-block';">`;
    }
    function drawFallbackPlayerIcon() {
        if (equippedCharId === 'basic') {
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fillStyle = player.color; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(player.x-7, player.y-5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(player.x+7, player.y-5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(player.x, player.y + 4, 6, 0, Math.PI, false); ctx.stroke();
        } else {
            ctx.font = '45px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(player.icon, player.x, player.y);
        }
    }

    // 적 PNG 이미지 경로: 나중에 파일만 교체하거나 이 표만 바꾸면 됩니다.
    const ENEMY_SPRITE_PATHS = {
        normal_red: 'assets/enemies/enemy_normal_red.png',
        normal_blue: 'assets/enemies/enemy_normal_blue.png',
        normal_purple: 'assets/enemies/enemy_normal_purple.png',
        elite_charger: 'assets/enemies/enemy_elite_charger.png',
        elite_mage: 'assets/enemies/enemy_elite_mage.png',
        elite_bomber: 'assets/enemies/enemy_elite_bomber.png',
        elite_void: 'assets/enemies/enemy_elite_void.png',
        boss_main: 'assets/enemies/boss_main.png'
    };

    // 전용 이미지가 없는 엘리트는 여기의 대체 이미지를 사용합니다.
    const ELITE_FALLBACK_MAP = {
        charger: 'elite_charger',
        mage: 'elite_mage',
        bomber: 'elite_bomber',
        void: 'elite_void',
        glutton: 'elite_bomber',
        flamer: 'elite_bomber',
        meteor: 'elite_mage'
    };

    // 충돌 판정은 e.size 그대로 두고, 보이는 이미지만 이 배율로 키웁니다.
    const ENEMY_RENDER_SCALE = {
        normal: 2.55,
        elite: 3.15,
        boss: 4.45
    };

    // 적 이미지 로드: 실패해도 게임은 기존 도형 fallback으로 계속 진행됩니다.
    const enemySprites = {};
    const enemySpriteCache = {};
    Object.keys(ENEMY_SPRITE_PATHS).forEach(key => {
        const img = new Image();
        img.onerror = () => console.warn(`Enemy sprite failed to load: ${ENEMY_SPRITE_PATHS[key]}`);
        img.src = ENEMY_SPRITE_PATHS[key];
        enemySprites[key] = img;
    });

    function getLoadedEnemySprite(key) {
        const img = enemySprites[key];
        return img && img.complete && img.naturalWidth > 0 ? img : null;
    }

    function getCachedEnemySprite(key, renderSize) {
        const img = getLoadedEnemySprite(key);
        if (!img) return null;

        const size = Math.max(24, Math.round(renderSize));
        const cacheKey = `${key}_${size}`;
        if (enemySpriteCache[cacheKey]) return enemySpriteCache[cacheKey];

        try {
            const cacheCanvas = document.createElement('canvas');
            cacheCanvas.width = size;
            cacheCanvas.height = size;
            const cacheCtx = cacheCanvas.getContext('2d');
            cacheCtx.imageSmoothingEnabled = true;
            cacheCtx.imageSmoothingQuality = 'high';
            cacheCtx.clearRect(0, 0, size, size);
            cacheCtx.drawImage(img, 0, 0, size, size);
            enemySpriteCache[cacheKey] = cacheCanvas;
            return cacheCanvas;
        } catch (error) {
            console.warn('Enemy sprite cache failed:', error);
            return img;
        }
    }

    // 적 타입과 색상 정보를 표시용 spriteKey로 바꿉니다.
    function getEnemySpriteKey(e) {
        if (e.spriteKey) return e.spriteKey;
        if (e.isBoss) return 'boss_main';
        if (e.isElite) return ELITE_FALLBACK_MAP[e.eliteType] || 'elite_bomber';
        if (e.color === '#FF3366' || e.color === '#FFD700') return 'normal_red';
        if (e.color === '#00E5FF' || e.color === '#39FF14') return 'normal_blue';
        return 'normal_purple';
    }

    function getNormalEnemySpriteKey(color) {
        if (color === '#FF3366' || color === '#FFD700') return 'normal_red';
        if (color === '#00E5FF' || color === '#39FF14') return 'normal_blue';
        return 'normal_purple';
    }

    function getEnemyRenderSize(e) {
        const scale = e.isBoss ? ENEMY_RENDER_SCALE.boss : (e.isElite ? ENEMY_RENDER_SCALE.elite : ENEMY_RENDER_SCALE.normal);
        return e.size * scale;
    }

    function moveEnemyTowardPlayer(enemy, speedMultiplier = 1, frameScale = 1) {
        if (!enemy || !player) return;

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy);

        if (!Number.isFinite(dist) || dist <= 0) return;

        const speed = (enemy.speed || 1) * speedMultiplier * (Number.isFinite(frameScale) ? frameScale : 1);
        enemy.x += (dx / dist) * speed;
        enemy.y += (dy / dist) * speed;
    }

    function isEnemyOnScreen(enemy, padding = 0) {
        if (!enemy || !canvas) return false;

        const pad = Number.isFinite(padding) ? padding : 0;
        return enemy.x >= -pad &&
            enemy.x <= canvas.width + pad &&
            enemy.y >= -pad &&
            enemy.y <= canvas.height + pad;
    }

    const EFFECT_IMAGE_SRC = {

    const effectSprites = {};
    const effectSpriteCache = {};
    Object.keys(EFFECT_IMAGE_SRC).forEach(key => {
        const img = new Image();
        img.onerror = () => console.warn(`Effect sprite failed to load: ${EFFECT_IMAGE_SRC[key]}`);
        img.src = EFFECT_IMAGE_SRC[key];
        effectSprites[key] = img;
    });

    function getLoadedEffectSprite(key) {
        const img = effectSprites[key];
        return img && img.complete && img.naturalWidth > 0 ? img : null;
    }

    function getCachedEffectSprite(key, size) {
        const img = getLoadedEffectSprite(key);
        if (!img) return null;

        const s = Math.max(16, Math.round(size));
        const cacheKey = `${key}_${s}`;
        if (effectSpriteCache[cacheKey]) return effectSpriteCache[cacheKey];

        try {
            const cacheCanvas = document.createElement('canvas');
            cacheCanvas.width = s;
            cacheCanvas.height = s;
            const cacheCtx = cacheCanvas.getContext('2d');
            cacheCtx.imageSmoothingEnabled = true;
            cacheCtx.imageSmoothingQuality = 'high';
            cacheCtx.clearRect(0, 0, s, s);
            cacheCtx.drawImage(img, 0, 0, s, s);
            effectSpriteCache[cacheKey] = cacheCanvas;
            return cacheCanvas;
        } catch (error) {
            console.warn('Effect sprite cache failed:', error);
            return img;
        }
    }

    function drawEffectSprite(key, x, y, size, rotation = 0, fallback = null) {
        const sprite = getCachedEffectSprite(key, size);
        if (!sprite) {
            if (fallback) fallback();
            return false;
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
        ctx.restore();
        return true;
    }

    // 이미지가 없을 때 사용하는 기존 도형 렌더링 fallback입니다.
    function drawEnemyFallbackShape(e) {
        ctx.fillStyle = (e.isBoss && e.patternState === 'enraged') ? '#FF0000' : (e.color === 'rainbow' ? `hsl(${Date.now() % 360}, 100%, 50%)` : e.color);
        ctx.beginPath();
        
        if (e.shape === 'square') ctx.rect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
        else if (e.shape === 'triangle') {
            ctx.moveTo(e.x + Math.cos(e.angle||0)*e.size, e.y + Math.sin(e.angle||0)*e.size);
            ctx.lineTo(e.x + Math.cos((e.angle||0)+2.5)*e.size, e.y + Math.sin((e.angle||0)+2.5)*e.size);
            ctx.lineTo(e.x + Math.cos((e.angle||0)-2.5)*e.size, e.y + Math.sin((e.angle||0)-2.5)*e.size);
            ctx.closePath();
        }
        else ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        
        ctx.fill();
        ctx.lineWidth = e.isElite ? 4 : 3;
        
        if (e.isElite) {
            ctx.strokeStyle = e.eliteType === 'charger' ? '#FF3300' : (e.eliteType === 'mage' ? '#9900FF' : '#FFFFFF');
        } else {
            ctx.strokeStyle = '#111';
        }
        ctx.stroke();
        
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(e.x-7, e.y-5, 5, 0, Math.PI*2); ctx.arc(e.x+7, e.y-5, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(e.x-7, e.y-5, 2, 0, Math.PI*2); ctx.arc(e.x+7, e.y-5, 2, 0, Math.PI*2); ctx.fill();
    }

    // 적 이미지 렌더링: PNG가 준비되면 중앙 정렬로 그리고, 아니면 기존 도형으로 돌아갑니다.
    function drawEnemy(e) {
        const spriteKey = getEnemySpriteKey(e);
        const baseRenderSize = getEnemyRenderSize(e);
        const sprite = getCachedEnemySprite(spriteKey, baseRenderSize);
        if (sprite) {
            const w = baseRenderSize;
            const h = baseRenderSize;
            ctx.save();
            ctx.translate(e.x, e.y);
            if (e.isBoss || e.isElite) {
                ctx.shadowBlur = e.isBoss ? 10 : 6;
                ctx.shadowColor = e.isBoss ? '#FF3366' : '#B026FF';
            }
            ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
            ctx.restore();
        } else {
            drawEnemyFallbackShape(e);
        }

        if (currentDifficulty === 'hard' && e.isBoss && e.berserk) {
            ctx.font = 'bold 20px Jua';
            ctx.fillStyle = '#FF3300';
            ctx.fillText('⚠️발광!⚠️', e.x, e.y - e.size - 25);
            ctx.beginPath(); ctx.arc(e.x, e.y, e.size + 12 + Math.random()*5, 0, Math.PI*2);
            ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 5; ctx.stroke();
        } else if (e.isBoss && e.patternState === 'enraged') {
            ctx.beginPath(); ctx.arc(e.x, e.y, e.size + 8, 0, Math.PI*2);
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.stroke();
        }
        
        if (e.isElite) {
            let symbol = e.eliteType === 'glutton' ? '😋' :
                         (e.eliteType === 'mage' ? '⚡' :
                         (e.eliteType === 'charger' ? '🔥' :
                         (e.eliteType === 'bomber' ? '💣' :
                         (e.eliteType === 'flamer' ? '☄️' :
                         (e.eliteType === 'meteor' ? '🌠' : '🌀')))));
            ctx.font = '15px Arial'; ctx.fillText(symbol, e.x, e.y - e.size - 6);
        }

        ctx.fillStyle = 'white'; ctx.font = `bold ${e.isBoss ? 20 : 14}px Jua`; ctx.textAlign = 'center';
        
        let hpText = e.berserk ? (e.berserkTimer / 1000).toFixed(1) + "초" : Math.ceil(e.hp + (e.shield || 0));
        ctx.strokeText(hpText, e.x, e.y + e.size + 15); ctx.fillText(hpText, e.x, e.y + e.size + 15);
        
        if ((e.isBoss || e.isElite) && !e.berserk) {
            const bw = e.size * 2.5;
            const yOff = e.size + (e.isBoss ? 20 : 26);
            ctx.fillStyle = 'rgba(10, 12, 28, 0.78)'; ctx.fillRect(e.x - bw/2, e.y - yOff, bw, 6);
            const sRatio = Math.max(0, e.shield / (e.maxHp - 8));
            ctx.shadowBlur = e.isBoss ? 10 : 7;
            ctx.shadowColor = e.isBoss ? '#FF3366' : '#00E5FF';
            ctx.fillStyle = e.isBoss ? '#FF3366' : '#00E5FF'; ctx.fillRect(e.x - bw/2, e.y - yOff, bw * sRatio, 6);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = e.isBoss ? 'rgba(255, 80, 120, 0.8)' : 'rgba(0, 229, 255, 0.7)';
            ctx.lineWidth = 1;
            ctx.strokeRect(e.x - bw/2, e.y - yOff, bw, 6);
        }
    }

    function renderStore() { 
        const grid = document.getElementById('storeGrid'); grid.innerHTML = '';
        CHARACTERS.forEach(char => {
            const charLvl = unlockedChars[char.id] || 0;
            const isOwned = charLvl > 0; 
            const isEquipped = equippedCharId === char.id;
            const frags = charFragments[char.id] || 0;
            
            const card = document.createElement('div'); 
            card.className = `char-card ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
            
            let html = `<div class="char-icon">${getCharacterThumbHtml(char)}</div><div class="char-name">${char.name}</div>`;
            
            if (char.id === 'basic') {
                html += `<div class="char-bonus" style="height:35px; margin-top:23px;">${char.desc}</div>`;
                html += isEquipped ? `<button class="buy-btn is-equipped">장착 중</button>` : `<button class="buy-btn can-equip" onclick="equipChar('${char.id}')">장착하기</button>`;
            } else {
                html += `<div class="frag-count">보유 조각: 🧩${frags}개</div>`;
                let chancePct = 10 + (Math.max(1, charLvl) - 1) * 5;
                html += `<div class="char-bonus"><span style="color:#FFF">[Lv.${Math.max(1, charLvl)}]</span> ${chancePct}% ${char.desc}</div>`;
                
                let equipBtn = isOwned ? (isEquipped ? `<button class="buy-btn is-equipped" style="margin-bottom:6px;">장착 중</button>` : `<button class="buy-btn can-equip" style="margin-bottom:6px;" onclick="equipChar('${char.id}')">장착하기</button>`) : '';
                html += equipBtn;

                let reqCost = charLvl === 0 ? 5 : 5 + (charLvl * 3); 
                let canUpgrade = frags >= reqCost;
                
                if (charLvl < BALANCE.maxCharacterLevel) {
                    let btnClass = canUpgrade ? 'can-buy' : '';
                    let disabled = canUpgrade ? '' : 'disabled style="background:#555; color:#ccc;"';
                    let btnText = isOwned ? `Lv.${charLvl+1} 강화 (${frags}/${reqCost})` : `영입하기 (${frags}/${reqCost})`;
                    html += `<button class="buy-btn ${btnClass}" ${disabled} onclick="upgradeChar('${char.id}', ${reqCost})">${btnText}</button>`;
                } else {
                    html += `<button class="buy-btn" style="background:#555; color:#fff;" disabled>MAX LV</button>`;
                }
            }
            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    function getExpGain(enemy) {
        const modeMultiplier = currentDifficulty === 'hard' ? BALANCE.hardExpMultiplier : BALANCE.normalExpMultiplier;
        const earlyBoost = level <= BALANCE.earlyExpBoostLevel ? BALANCE.earlyExpBoost : 1;
        return enemy.maxHp * modeMultiplier * earlyBoost;
    }

    function getNextMaxExp(nextLevel) {
        return Math.floor((BALANCE.levelExpBase + Math.pow(nextLevel, BALANCE.levelExpPow) * 1.85) * 1.02);
    }

        visualEffects.push({ type: 'pulse', x, y, color, radius, duration, maxDuration: duration });
    }

    function createParticles(x, y, color) { 
        for (let i = 0; i < 6; i++) { particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, size: Math.random()*4+2, color, life: 1.0, decay: 0.025 }); } 
    }
    
    function spawnItem() { 
        const r = Math.random();
        let type = r < 0.3 ? 'heart' : (r < 0.6 ? 'bomb' : 'blackhole'); 
        items.push({ type: type, x: Math.random()*700+50, y: Math.random()*500+50, radius: 15, pulse: 0 }); 
    }
    function useBombItem() { 
        if (enemies.length === 0) return; 
        const targetColor = COLORS[Math.floor(Math.random() * COLORS.length)]; 
        let killedCount = 0;
        for (let i = enemies.length - 1; i >= 0; i--) { 
            if (enemies[i].color === targetColor && !enemies[i].isBoss && !enemies[i].isElite) { 
                const e = enemies[i]; 
                
                // 🔥 점수 획득 공식 (노말은 1/3, 하드는 100%)
                let points = currentDifficulty === 'hard' ? e.maxHp : Math.ceil(e.maxHp / 3);
                score += points; 
                exp += getExpGain(e); // 경험치만 진행감 개선용 배율 적용
                
                createParticles(e.x, e.y, e.color); enemies.splice(i, 1); 
                killedCount++;
            } 
        } 
        if (killedCount > 0) checkLevelUp();
        shakeAmount = 15; 
    }

    function spawnEnemy(isBoss = false, forceElite = false) {
        let x, y;
        if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -50 : canvas.width + 50; y = Math.random() * canvas.height; } 
        else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -50 : canvas.height + 50; }
        
        let hellScale = currentDifficulty === 'hard' && level > 28 ? Math.pow(1.055, level - 28) : 1;

        if (isBoss) {
            const isEliteBoss = level % 10 === 0; 
            let totalHp = Math.floor((isEliteBoss ? level * 16 : level * 9) * hellScale);
            
            if (currentDifficulty === 'normal') {
                totalHp = Math.floor(totalHp * BALANCE.normalBossHpScale);
            } else {
                totalHp = Math.floor(totalHp * (isEliteBoss ? BALANCE.hardEliteBossHpScale : BALANCE.hardBossHpScale));
            }

            const bSpeed = currentDifficulty === 'hard' ? (isEliteBoss ? 1.42 : 1.02) : (isEliteBoss ? 1.50 : 1.02);
            enemies.push({ 
                x, y, size: isEliteBoss ? 45 : 35, shape: 'square', color: '#2D00F7', 
                shield: totalHp - 8, hp: 8, maxHp: totalHp, speed: bSpeed, baseSpeed: bSpeed, 
                isBoss: true, bossLevel: level, invuln: 0, patternState: 'normal', patternTimer: 5000,
                berserk: false, berserkUsed: false, spriteKey: 'boss_main'
            });
            createNeonPulse(x, y, '#FF3366', isEliteBoss ? 150 : 115, 520);
        } else {
            let currentElites = enemies.filter(e => e.isElite).length;
            const bossAlive = currentDifficulty === 'hard' && enemies.some(e => e.isBoss);
            
            // 노말은 중반부터, 하드는 초반부터 엘리트 압박이 오도록 확률만 조정합니다.
            let isElite = false;
            if (currentDifficulty === 'hard') {
                const eliteLimit = bossAlive
                    ? BALANCE.hardEliteMaxCountDuringBoss
                    : (level < 10 ? BALANCE.hardEliteMaxCountBefore10 : BALANCE.hardEliteMaxCount);
                const baseEliteChance = Math.min(BALANCE.hardEliteMaxChance, BALANCE.hardEliteBaseChance + Math.max(0, level - BALANCE.hardEliteStartLevel) * 0.007);
                const eliteChance = bossAlive ? baseEliteChance * BALANCE.hardEliteChanceDuringBossMultiplier : baseEliteChance;
                isElite = level >= BALANCE.hardEliteStartLevel && currentElites < eliteLimit && (forceElite || Math.random() < eliteChance);
                if (isElite) eliteSpawnCounter = 0;
            } else {
                const normalEliteChance = Math.min(BALANCE.normalEliteMaxChance, BALANCE.normalEliteBaseChance + Math.max(0, level - BALANCE.normalEliteStartLevel) * 0.003);
                isElite = level >= BALANCE.normalEliteStartLevel && currentElites < 2 && Math.random() < normalEliteChance;
            }
            
            if (isElite) {
                let types = currentDifficulty === 'hard' ? ['charger', 'mage', 'glutton'] : ['charger', 'glutton'];
                if (currentDifficulty === 'hard' && level >= 20) types.push('bomber', 'flamer');
                if (currentDifficulty === 'hard' && level >= 30) types.push('meteor', 'void');
                
                const eType = types[Math.floor(Math.random() * types.length)];
                const totalHp = Math.max(8, Math.floor(level * 7.5 * hellScale * (currentDifficulty === 'hard' ? BALANCE.hardEliteHpScale : 0.85))); 
                
                const eColor = eType === 'charger' ? '#FFFFFF' : 
                             (eType === 'mage' ? '#000000' : 
                             (eType === 'glutton' ? 'rainbow' : 
                             (eType === 'bomber' ? '#FF6600' : 
                             (eType === 'flamer' ? '#FF0000' : 
                             (eType === 'meteor' ? '#9900FF' : '#330000'))))); 
                
                enemies.push({
                    x, y, size: 25, shape: (eType==='charger' ? 'triangle' : eType==='mage' ? 'square' : 'circle'), 
                    color: eColor, 
                    shield: totalHp - 8, hp: 8, maxHp: totalHp, speed: (currentDifficulty === 'hard' ? 1.44 : 1.24), isBoss: false, isElite: true, eliteType: eType,
                    actionTimer: 2000, subState: (eType==='charger' ? 'aim' : ''), hasEntered: false, spriteKey: ELITE_FALLBACK_MAP[eType] || 'elite_bomber'
                });
            } else {
                let hp = (level <= 5) ? Math.floor(Math.random() * 3) + 1 : Math.floor((Math.random() * (2 + level * 1.8)) * hellScale) + 1;
                hp = Math.max(1, Math.floor(hp * (currentDifficulty === 'hard' ? BALANCE.hardEnemyHpScale : BALANCE.normalEnemyHpScale)));
                let baseSpeed = (currentDifficulty === 'hard' ? 0.92 : 0.90) * Math.pow(currentDifficulty === 'hard' ? BALANCE.hardSpeedGrowth : BALANCE.normalSpeedGrowth, Math.min(level, 50)); 
                const enemyColor = COLORS[Math.floor(Math.random() * COLORS.length)];
                enemies.push({ x, y, size: 16, shape: SHAPES[Math.floor(Math.random() * SHAPES.length)], color: enemyColor, hp, maxHp: hp, speed: baseSpeed + Math.random() * 0.4, isBoss: false, invuln: 0, spriteKey: getNormalEnemySpriteKey(enemyColor) });
            }
        }
    }

    function handleEnemyDeath(e, index, array) {
        // 🔥 점수 획득 공식 (노말은 1/3, 하드는 100%)
        let points = currentDifficulty === 'hard' ? e.maxHp : Math.ceil(e.maxHp / 3);
        score += points; 
        exp += getExpGain(e); 

        if (e.color === 'rainbow') createParticles(e.x, e.y, `hsl(${Date.now() % 360}, 100%, 50%)`);
        else createParticles(e.x, e.y, e.color); 
        
        let wasBoss = e.isBoss; array.splice(index, 1); 
        
        if (wasBoss) {
            if (!selectedUlt || selectedUlt === 'pending') {
                selectedUlt = 'pending'; triggerUltSelectModal();
            } else {
                triggerUltUpgradeModal();
            }
        } else {
            checkLevelUp();
        }
    }

    function update(deltaTime) {
        if (isPaused || !isPlaying) return;
        const frameScale = Math.min(3, Math.max(0.25, deltaTime / 16.67));
        itemTimer += deltaTime; if (itemTimer > (currentDifficulty === 'hard' ? BALANCE.itemSpawnMsHard : BALANCE.itemSpawnMsNormal)) { spawnItem(); itemTimer = 0; }
        enemyTimer += deltaTime;

        const MAX_ENEMIES = currentDifficulty === 'hard' ? BALANCE.maxEnemiesHard : BALANCE.maxEnemiesNormal; 
        const hardBossAlive = currentDifficulty === 'hard' && enemies.some(e => e.isBoss);
        let spawnDelay = currentDifficulty === 'hard'
            ? Math.floor((level <= 5 ? 620 : Math.max(300, 980 - (level * 50))) / BALANCE.hardSpawnSpeedMultiplier)
            : Math.floor((level <= 5 ? 480 : Math.max(230, 860 - (level * 52))) / BALANCE.normalSpawnSpeedMultiplier);
        if (hardBossAlive) spawnDelay = Math.floor(spawnDelay * 1.16);
        
        if (enemyTimer > spawnDelay && enemies.length < MAX_ENEMIES) { 
            spawnEnemy(); 
            enemyTimer = 0; 
        }
        
        for (let i = blackHoles.length - 1; i >= 0; i--) {
            blackHoles[i].duration -= deltaTime;
            if (blackHoles[i].duration <= 0) blackHoles.splice(i, 1);
        }

        for (let i = dangerZones.length - 1; i >= 0; i--) {
            let dz = dangerZones[i];
            dz.timer -= deltaTime;
            if (dz.timer <= 0) {
                createParticles(dz.x, dz.y, '#9900FF');
                shakeAmount = 8;
                if (Math.hypot(player.x - dz.x, player.y - dz.y) < dz.radius + player.radius) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= 20; damageFlash = 0.4;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    } else {
                        createParticles(player.x, player.y, '#FFF'); 
                    }
                }
                dangerZones.splice(i, 1);
            }
        }

        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let ep = enemyProjectiles[i];
            ep.x += ep.vx * frameScale; ep.y += ep.vy * frameScale;
            if (Math.hypot(player.x - ep.x, player.y - ep.y) < player.radius + ep.radius) {
                if (Math.random() >= player.evasion) {
                    player.hp -= ep.damage; damageFlash = 0.4; shakeAmount = 8;
                    if (player.hp <= 0) { player.hp = 0; gameOver(); }
                } else { 
                    createParticles(player.x, player.y, '#FFF'); 
                }
                enemyProjectiles.splice(i, 1);
                continue;
            }
            if (ep.x < -50 || ep.x > canvas.width + 50 || ep.y < -50 || ep.y > canvas.height + 50) enemyProjectiles.splice(i, 1);
        }

        for (let i = enemyUltEffects.length - 1; i >= 0; i--) {
            let eff = enemyUltEffects[i];
            eff.progress += 0.03 * (deltaTime/16);
            if (eff.progress >= 1.0) {
                shakeAmount = 15;
                for(let k=0; k<20; k++) createParticles(eff.targetX, eff.targetY, '#9900FF');
                if (Math.hypot(eff.targetX - player.x, eff.targetY - player.y) < 80 + player.radius) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= eff.damage; damageFlash = 0.4; shakeAmount = 15;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    } else { 
                        createParticles(player.x, player.y, '#FFF'); 
                    }
                }
                enemyUltEffects.splice(i, 1);
            }
        }

        for (let i = enemyBlackHoles.length - 1; i >= 0; i--) {
            let bh = enemyBlackHoles[i];
            bh.duration -= deltaTime;
            if (bh.duration <= 0) { enemyBlackHoles.splice(i, 1); continue; }
            const dist = Math.hypot(bh.x - player.x, bh.y - player.y);
            if (dist < bh.radius) {
                const a = Math.atan2(bh.y - player.y, bh.x - player.x);
                player.x += Math.cos(a) * bh.pullStrength * frameScale;
                player.y += Math.sin(a) * bh.pullStrength * frameScale;
                if (dist < 40) {
                    if (Math.random() >= player.evasion) {
                        player.hp -= bh.tickDamage; damageFlash = 0.1;
                        if (player.hp <= 0) { player.hp = 0; gameOver(); }
                    }
                }
            }
        }

        let sizeMod = 1.0 + (ultStats.sizeLevel * 0.25); 

        if (activeUltTimer > 0) {
            activeUltTimer -= deltaTime;
            if (selectedUlt === 'flame') {
                activeUltData.angle += 0.15;
                for(let k=0; k<3; k++) {
                    const a = activeUltData.angle + (Math.PI*2/3)*k;
                    particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*7*sizeMod, vy: Math.sin(a)*7*sizeMod, size: (Math.random()*15+10)*sizeMod, color: (Math.random()>0.5 ? '#FF3300' : '#FF9900'), life: 1.0, decay: 0.04 });
                }
                enemies.forEach(e => {
                    if (Math.hypot(player.x - e.x, player.y - e.y) < BALANCE.flameRadius * sizeMod) {
                        const isInvincible = e.isBoss && e.patternState === 'enraged';
                        if (!isInvincible) {
                            let dmg = (BALANCE.flameBaseDamage + (ultStats.damageLevel * BALANCE.flameDamagePerUpgrade)) * (deltaTime/16); 
                            if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                            else { e.hp -= dmg; }
                        }
                        const angle = Math.atan2(e.y - player.y, e.x - player.x);
                        e.x += Math.cos(angle) * BALANCE.flameKnockback * frameScale; e.y += Math.sin(angle) * BALANCE.flameKnockback * frameScale;
                    }
                });
            } else if (selectedUlt === 'meteor') {
                activeUltData.timer -= deltaTime;
                if (activeUltData.timer <= 0 && activeUltData.drops > 0) {
                    activeUltData.drops--; activeUltData.timer = 300; 
                    if (enemies.length > 0) {
                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        ultEffects.push({ type: 'meteor', startX: target.x + 200, startY: target.y - 400, targetX: target.x, targetY: target.y, progress: 0 });
                    }
                }
            }
        }

        for (let i = ultEffects.length - 1; i >= 0; i--) {
            let eff = ultEffects[i];
            if (eff.type === 'bomb') {
                eff.timer -= deltaTime;
                if (eff.timer <= 0) {
                    shakeAmount = 30; ultFlash = 1.0;
                    createNeonPulse(eff.x, eff.y, '#FF6633', 210 * sizeMod, 480);
                    enemies.forEach(e => {
                        if (Math.hypot(eff.x - e.x, eff.y - e.y) < 400 * sizeMod) {
                            const isInvincible = e.isBoss && e.patternState === 'enraged';
                            if (!isInvincible) {
                                let dmg = 3 + (ultStats.damageLevel * 3); 
                                if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                                else { e.hp -= dmg; }
                            }
                        }
                    });
                    for(let k=0; k<30; k++) createParticles(eff.x + (Math.random()-0.5)*200*sizeMod, eff.y + (Math.random()-0.5)*200*sizeMod, '#FFF');
                    ultEffects.splice(i, 1);
                }
            } else if (eff.type === 'meteor') {
                eff.progress += 0.04 * (deltaTime/16); 
                const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
                const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
                particles.push({x: curX, y: curY, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, size: Math.random()*8+4, color: '#FFD700', life: 1.0, decay: 0.05});

                if (eff.progress >= 1.0) {
                    shakeAmount = 15;
                    createNeonPulse(eff.targetX, eff.targetY, '#FF3366', 145 * sizeMod, 420);
                    for(let k=0; k<20; k++) createParticles(eff.targetX, eff.targetY, '#FF3366');
                    enemies.forEach(e => {
                        if (Math.hypot(eff.targetX - e.x, eff.targetY - e.y) < 120 * sizeMod) {
                            const isInvincible = e.isBoss && e.patternState === 'enraged';
                            if (!isInvincible) {
                                let dmg = 5 + (ultStats.damageLevel * 5); 
                                if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                                else { e.hp -= dmg; }
                            }
                        }
                    });
                    ultEffects.splice(i, 1);
                }
            }
        }

        if (ultFlash > 0) ultFlash -= 0.02;

        attackTimer += deltaTime;
        if (attackTimer > weapons.fireRate) { 
            if (enemies.length > 0) {
                let nearest = enemies[0], minDist = Math.hypot(player.x - enemies[0].x, player.y - enemies[0].y);
                enemies.forEach(e => { const d = Math.hypot(player.x - e.x, player.y - e.y); if (d < minDist) { minDist = d; nearest = e; } });
                const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                for(let i=0; i<weapons.multiShot; i++) {
                    const angle = baseAngle - (0.2 * (weapons.multiShot - 1)) / 2 + (i * 0.2);
                    projectiles.push({ x: player.x, y: player.y, radius: weapons.projSize, color: '#FFF500', velocity: { x: Math.cos(angle) * 8, y: Math.sin(angle) * 8 }, damage: weapons.damage, pierce: weapons.pierce, hitIds: new Set() });
                }
            }
            attackTimer = 0; 
        }
        weapons.orbitalAngle += 0.05 * frameScale;

        if (currentControlType === 'keyboard') {
            if ((keys.ArrowUp || keys.w) && player.y > 20) player.y -= player.speed * frameScale;
            if ((keys.ArrowDown || keys.s) && player.y < canvas.height - 20) player.y += player.speed * frameScale;
            if ((keys.ArrowLeft || keys.a) && player.x > 20) player.x -= player.speed * frameScale;
            if ((keys.ArrowRight || keys.d) && player.x < canvas.width - 20) player.x += player.speed * frameScale;
            targetX = player.x; targetY = player.y; 
        } 
        else if (currentControlType === 'mouse') {
            const dist = Math.hypot(targetX - player.x, targetY - player.y);
            if (dist > player.speed * frameScale) {
                player.x += (targetX - player.x) / dist * player.speed * frameScale;
                player.y += (targetY - player.y) / dist * player.speed * frameScale;
            }
        }
        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
        player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * frameScale;
            p.y += p.vy * frameScale;
            p.life -= (p.decay || 0.02);
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = visualEffects.length - 1; i >= 0; i--) {
            visualEffects[i].duration -= deltaTime;
            if (visualEffects[i].duration <= 0) visualEffects.splice(i, 1);
        }
        
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.pulse += 0.1; 
            if(Math.hypot(player.x-item.x, player.y-item.y) < player.radius+item.radius) { 
                if (item.type === 'heart') {
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                    createParticles(player.x, player.y, '#FF3366');
                    createNeonPulse(player.x, player.y, '#FF5C8A', 52, 320);
                } else if (item.type === 'bomb') {
                    createNeonPulse(item.x, item.y, '#FF6633', 96, 360);
                    useBombItem(); 
                } else if (item.type === 'blackhole') {
                    createNeonPulse(item.x, item.y, '#B026FF', 78, 380);
                    triggerBlackHole();
                }
                items.splice(i, 1); 
            } 
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i]; p.x += p.velocity.x * frameScale; p.y += p.velocity.y * frameScale;
            if (p.x < -50 || p.x > canvas.width + 50 || p.y < -50 || p.y > canvas.height + 50) { projectiles.splice(i, 1); continue; }
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (!p.hitIds.has(e) && Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.size) {
                    p.hitIds.add(e); 
                    const isInvincible = e.isBoss && e.patternState === 'enraged';
                    
                    if (!isInvincible) {
                        let dmg = p.damage * (e.isBoss ? weapons.bossDamageMult : 1);
                        if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= dmg; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } else e.hp -= dmg;
                        
                        addUltGauge(dmg); 
                        
                        if (e.hp <= 0) { 
                            // 🔥 하드 모드 보스는 20레벨 발광
                            if (currentDifficulty === 'hard' && e.isBoss && e.bossLevel >= 20 && !e.berserkUsed) {
                                e.hp = 1; e.berserk = true; e.berserkUsed = true; e.berserkTimer = 5200; e.shield = 0;
                            } else {
                                handleEnemyDeath(e, j, enemies); break; 
                            }
                        }
                    }
                    if (p.pierce <= 0) { projectiles.splice(i, 1); break; } else p.pierce -= 1;
                }
            }
        }
        
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i]; 
            
            if (e.isBoss) {
                if (currentDifficulty === 'hard' && e.berserk) {
                    e.berserkTimer -= deltaTime;
                    e.patternState = 'enraged'; 
                    e.speed = e.baseSpeed * 2.8; 
                    createParticles(e.x + (Math.random()-0.5)*e.size, e.y + (Math.random()-0.5)*e.size, '#FF0000'); 
                    
                    if (e.berserkTimer <= 0) {
                        e.berserk = false; e.hp = 0;
                        handleEnemyDeath(e, i, enemies);
                        continue;
                    }
                } else {
                    e.patternTimer -= deltaTime;
                    if (e.patternTimer <= 0) {
                        // 🔥 노말은 무적패턴 지속 짧고 주기 긺
                        let normalDur = (currentDifficulty === 'hard' && e.bossLevel >= 10) ? 3600 : 4200;
                        let enragedDur = (currentDifficulty === 'hard' && e.bossLevel >= 10) ? 2300 : 2400;
                        
                        if (e.patternState === 'normal') {
                            e.patternState = 'enraged';
                            e.patternTimer = enragedDur;
                            e.speed = e.baseSpeed * (currentDifficulty === 'hard' ? 2.15 : 2.2);
                        } else {
                            e.patternState = 'normal';
                            e.patternTimer = normalDur;
                            e.speed = e.baseSpeed;
                        }
                    }
                }
            }

            if (e.isElite) {
                if (!e.hasEntered) {
                    // 엘리트가 화면 밖에서 스킬만 쓰는 문제 방지: 먼저 화면 안으로 진입시킨 뒤 패턴 시작
                    moveEnemyTowardPlayer(e, 1.8, frameScale);
                    if (isEnemyOnScreen(e, 30)) {
                        e.hasEntered = true;
                        e.actionTimer = e.eliteType === 'charger' ? 1200 : 1800;
                    }
                } else if (e.eliteType === 'charger') {
                    if (e.subState === 'aim') {
                        e.actionTimer -= deltaTime;
                        e.angle = Math.atan2(player.y - e.y, player.x - e.x);
                        if (e.actionTimer <= 0) { e.subState = 'dash'; e.actionTimer = 800; } 
                    } else if (e.subState === 'dash') {
                        e.actionTimer -= deltaTime;
                        e.x += Math.cos(e.angle) * e.speed * 4 * frameScale;
                        e.y += Math.sin(e.angle) * e.speed * 4 * frameScale;
                        if (e.actionTimer <= 0) { e.subState = 'aim'; e.actionTimer = 2000; }
                    }
                } else if (e.eliteType === 'mage') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        dangerZones.push({x: player.x, y: player.y, radius: 70, timer: 2000});
                        e.actionTimer = 3500;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    if (dist < 200) { e.x -= Math.cos(angle) * e.speed * 0.8 * frameScale; e.y -= Math.sin(angle) * e.speed * 0.8 * frameScale; } 
                    else { e.x += Math.cos(angle) * e.speed * 0.5 * frameScale; e.y += Math.sin(angle) * e.speed * 0.5 * frameScale; }
                } else if (e.eliteType === 'glutton') {
                    if (items.length > 0) {
                        let nearest = items[0], minDist = Math.hypot(items[0].x - e.x, items[0].y - e.y);
                        items.forEach(it => { let d = Math.hypot(it.x - e.x, it.y - e.y); if(d < minDist) { minDist = d; nearest = it; } });
                        const angle = Math.atan2(nearest.y - e.y, nearest.x - e.x);
                        e.x += Math.cos(angle) * e.speed * 1.8 * frameScale; 
                        e.y += Math.sin(angle) * e.speed * 1.8 * frameScale;
                        if (minDist < e.size + nearest.radius) {
                            items.splice(items.indexOf(nearest), 1);
                            e.shield += 50; e.size = Math.min(e.size + 8, 60); e.speed += 0.2;
                            createParticles(e.x, e.y, '#00FF33');
                        }
                    } else {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        e.x += Math.cos(angle) * e.speed * frameScale; e.y += Math.sin(angle) * e.speed * frameScale;
                    }
                } 
                else if (e.eliteType === 'flamer') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        for(let k=-2; k<=2; k++) {
                            enemyProjectiles.push({ x: e.x, y: e.y, radius: 6, color: '#FF3300', vx: Math.cos(angle + k*0.2)*5, vy: Math.sin(angle + k*0.2)*5, damage: 10 });
                        }
                        e.actionTimer = 3000;
                    }
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * 0.7 * frameScale; e.y += Math.sin(angle) * e.speed * 0.7 * frameScale;
                } else if (e.eliteType === 'bomber') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        dangerZones.push({x: player.x, y: player.y, radius: 105, timer: 2100}); 
                        e.actionTimer = 4300;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (dist > 360) {
                        moveEnemyTowardPlayer(e, 0.95, frameScale);
                    } else if (dist < 240) {
                        const angle = Math.atan2(e.y - player.y, e.x - player.x);
                        e.x += Math.cos(angle) * e.speed * frameScale;
                        e.y += Math.sin(angle) * e.speed * frameScale;
                    } else {
                        moveEnemyTowardPlayer(e, 0.25, frameScale);
                    }
                } else if (e.eliteType === 'meteor') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        enemyUltEffects.push({ type: 'meteor', startX: player.x + 300, startY: player.y - 500, targetX: player.x, targetY: player.y, progress: 0, damage: 20 });
                        e.actionTimer = 3500;
                    }
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (dist > 400) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        e.x += Math.cos(angle) * e.speed * frameScale; e.y += Math.sin(angle) * e.speed * frameScale;
                    }
                } else if (e.eliteType === 'void') {
                    e.actionTimer -= deltaTime;
                    if (e.actionTimer <= 0) {
                        enemyBlackHoles.push({x: e.x, y: e.y, radius: 250, pullStrength: 2.0, tickDamage: 0.5, duration: 4000});
                        e.actionTimer = 6000;
                    }
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * 0.5 * frameScale; e.y += Math.sin(angle) * e.speed * 0.5 * frameScale;
                }
                if (e.hasEntered && e.eliteType !== 'charger') {
                    e.x = Math.max(20, Math.min(canvas.width - 20, e.x));
                    e.y = Math.max(20, Math.min(canvas.height - 20, e.y));
                }
            } else {
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed * frameScale; e.y += Math.sin(angle) * e.speed * frameScale;
            }

            blackHoles.forEach(bh => {
                const dist = Math.hypot(bh.x - e.x, bh.y - e.y);
                if (dist < bh.radius) {
                    const a = Math.atan2(bh.y - e.y, bh.x - e.x);
                    e.x += Math.cos(a) * bh.pullStrength * frameScale;
                    e.y += Math.sin(a) * bh.pullStrength * frameScale;
                    if (dist < 60) {
                        if (e.shield > 0) { e.shield -= bh.tickDamage; if(e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                        else { e.hp -= bh.tickDamage; }
                    }
                }
            });

            if (weapons.orbitals > 0 && (e.invuln || 0) <= 0) {
                for(let o=0; o<weapons.orbitals; o++) {
                    const ox = player.x + Math.cos(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * BALANCE.orbitalRadius;
                    const oy = player.y + Math.sin(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * BALANCE.orbitalRadius;
                    if (Math.hypot(ox - e.x, oy - e.y) < BALANCE.orbitalHitRadius + e.size) {
                        const isInvincible = e.isBoss && e.patternState === 'enraged';
                        if (!isInvincible) {
                            let d = (weapons.damage * BALANCE.orbitalDamageMultiplier + weapons.orbitals * BALANCE.orbitalDamagePerSwordBonus) * (e.isBoss ? weapons.bossDamageMult : 1);
                            if ((e.isBoss || e.isElite) && (e.shield || 0) > 0) { e.shield -= d; if (e.shield < 0) { e.hp += e.shield; e.shield = 0; } } 
                            else { e.hp -= d; }
                            addUltGauge(d); 
                        }
                        e.invuln = BALANCE.orbitalHitCooldownMs; break;
                    }
                }
            }
            
            if (e.hp <= 0) { 
                if (currentDifficulty === 'hard' && e.isBoss && e.bossLevel >= 20 && !e.berserkUsed) {
                    e.hp = 1; e.berserk = true; e.berserkUsed = true; e.berserkTimer = 5200; e.shield = 0;
                } else {
                    handleEnemyDeath(e, i, enemies); continue; 
                }
            }
            
            if (e.invuln > 0) e.invuln -= deltaTime;
            
            if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.size) {
                let collisionDmg = Math.min(e.hp, currentDifficulty === 'hard' ? BALANCE.hardCollisionDamageCap : BALANCE.normalCollisionDamageCap);
                if (currentDifficulty === 'hard' && e.berserk) collisionDmg = 22; 
                
                if (Math.random() >= player.evasion) {
                    player.hp -= collisionDmg; damageFlash = 0.4; shakeAmount = 10;
                    if (player.hp <= 0) { player.hp = 0; gameOver(); }
                } else {
                    createParticles(player.x, player.y, '#FFF'); 
                }
                
                if (e.isBoss) { 
                    let nx, ny, d; 
                    do { nx = Math.random()*700+50; ny = Math.random()*500+50; d = Math.hypot(player.x-nx, player.y-ny); } while(d<350); 
                    e.x=nx; e.y=ny; 
                } else {
                    enemies.splice(i, 1);
                }
            }
        }
        if (shakeAmount > 0) shakeAmount *= Math.pow(0.9, frameScale); if (damageFlash > 0) damageFlash -= 0.02 * frameScale;
    }

    function checkLevelUp() {
        if (!isPlaying || gameOverProcessed || !player || !weapons) return;
        if (exp >= maxExp && selectedUlt !== 'pending') {
            exp -= maxExp; level++; 
            maxExp = getNextMaxExp(level);
            createNeonPulse(player.x, player.y, '#00E5FF', 115, 420);
            if (Math.floor(level / 5) > Math.floor((level - 1) / 5)) spawnEnemy(true);
            triggerLevelUpModal();
        }
    }

    function hasFiniteXY(obj) {
        return obj && Number.isFinite(Number(obj.x)) && Number.isFinite(Number(obj.y));
    }

    function sanitizeRuntimeArrays() {
        enemies = Array.isArray(enemies) ? enemies.filter(e => hasFiniteXY(e) && Number.isFinite(Number(e.size)) && Number(e.size) > 0) : [];
        items = Array.isArray(items) ? items.filter(item => hasFiniteXY(item) && Number.isFinite(Number(item.radius))) : [];
        particles = Array.isArray(particles) ? particles.filter(p => hasFiniteXY(p) && Number.isFinite(Number(p.life))) : [];
        visualEffects = Array.isArray(visualEffects) ? visualEffects.filter(eff => hasFiniteXY(eff) && Number.isFinite(Number(eff.life))) : [];
        dangerZones = Array.isArray(dangerZones) ? dangerZones.filter(dz => hasFiniteXY(dz) && Number.isFinite(Number(dz.radius))) : [];
        blackHoles = Array.isArray(blackHoles) ? blackHoles.filter(bh => hasFiniteXY(bh) && Number.isFinite(Number(bh.radius))) : [];
        enemyBlackHoles = Array.isArray(enemyBlackHoles) ? enemyBlackHoles.filter(bh => hasFiniteXY(bh) && Number.isFinite(Number(bh.radius))) : [];
        enemyProjectiles = Array.isArray(enemyProjectiles) ? enemyProjectiles.filter(ep => hasFiniteXY(ep) && Number.isFinite(Number(ep.vx)) && Number.isFinite(Number(ep.vy)) && Number.isFinite(Number(ep.radius))) : [];
        enemyUltEffects = Array.isArray(enemyUltEffects) ? enemyUltEffects.filter(eff =>
            Number.isFinite(Number(eff.startX)) && Number.isFinite(Number(eff.startY)) &&
            Number.isFinite(Number(eff.targetX)) && Number.isFinite(Number(eff.targetY)) &&
            Number.isFinite(Number(eff.progress))
        ) : [];
        projectiles = Array.isArray(projectiles) ? projectiles.filter(p =>
            hasFiniteXY(p) && p.velocity &&
            Number.isFinite(Number(p.velocity.x)) && Number.isFinite(Number(p.velocity.y)) &&
            Number.isFinite(Number(p.radius))
        ) : [];
        ultEffects = Array.isArray(ultEffects) ? ultEffects.filter(eff => {
            if (eff.type === 'bomb') return hasFiniteXY(eff) && Number.isFinite(Number(eff.timer)) && Number.isFinite(Number(eff.maxTimer));
            if (eff.type === 'meteor') {
                return Number.isFinite(Number(eff.startX)) && Number.isFinite(Number(eff.startY)) &&
                    Number.isFinite(Number(eff.targetX)) && Number.isFinite(Number(eff.targetY)) &&
                    Number.isFinite(Number(eff.progress));
            }
            return true;
        }) : [];
    }

    function recoverFromFrameError(error) {
        console.warn('게임 화면 상태를 복구했습니다:', error && error.message ? error.message : error);
        try {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        } catch (resetError) {}

        if (!player || !hasFiniteXY(player)) {
            const safeIcon = (CHARACTERS.find(c => c.id === equippedCharId) || CHARACTERS[0]).icon;
            player = { x: 400, y: 300, radius: 20, speed: 2.8, color: '#00E5FF', hp: 100, maxHp: 100, icon: safeIcon, evasion: 0, evasionLevel: 0 };
            targetX = player.x;
            targetY = player.y;
        }
        if (!weapons) {
            weapons = { damage: 1, fireRate: 400, multiShot: 1, pierce: 0, projSize: 7, orbitals: 0, orbitalAngle: 0, bossDamageMult: 1.0 };
        }
        if (activeUltTimer > 0 && selectedUlt === 'flame' && !Number.isFinite(Number(activeUltData.angle))) {
            activeUltData = { angle: 0 };
        }
        if (activeUltTimer > 0 && selectedUlt === 'meteor') {
            activeUltData = {
                drops: Number.isFinite(Number(activeUltData.drops)) ? activeUltData.drops : 0,
                timer: Number.isFinite(Number(activeUltData.timer)) ? activeUltData.timer : 0
            };
        }
        sanitizeRuntimeArrays();
        if (screens.levelUp.style.display !== 'flex') isPaused = false;
        lastTime = performance.now();
        saveActiveGame();
    }

    const NEON_BG_PARTICLES = Array.from({ length: 34 }, (_, i) => ({
        x: (i * 97) % 800,
        y: (i * 53) % 600,
        size: 1 + (i % 3),
        speed: 0.18 + (i % 5) * 0.035,
        color: i % 2 === 0 ? 'rgba(0, 229, 255, 0.45)' : 'rgba(176, 38, 255, 0.38)'
    }));

    function drawNeonBackground(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#050713';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cyanGlow = ctx.createRadialGradient(620, 180, 10, 620, 180, 360);
        cyanGlow.addColorStop(0, 'rgba(0, 229, 255, 0.12)');
        cyanGlow.addColorStop(1, 'rgba(0, 229, 255, 0)');
        ctx.fillStyle = cyanGlow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const purpleGlow = ctx.createRadialGradient(170, 470, 10, 170, 470, 330);
        purpleGlow.addColorStop(0, 'rgba(176, 38, 255, 0.12)');
        purpleGlow.addColorStop(1, 'rgba(176, 38, 255, 0)');
        ctx.fillStyle = purpleGlow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const gridOffset = (now * 0.018) % 40;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        for (let i = -40; i < canvas.width + 40; i += 40) {
            ctx.beginPath(); ctx.moveTo(i + gridOffset, 0); ctx.lineTo(i - 80 + gridOffset, canvas.height); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(176, 38, 255, 0.08)';
        for (let j = 0; j < canvas.height; j += 40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        NEON_BG_PARTICLES.forEach(p => {
            const y = (p.y + now * p.speed * 0.02) % canvas.height;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, y, p.size, p.size);
        });
    }

    function drawNeonBar(x, y, w, h, ratio, colorA, colorB, label = '', borderColor = colorA) {
        const r = Math.max(0, Math.min(1, ratio || 0));
        ctx.save();
        ctx.fillStyle = 'rgba(4, 8, 20, 0.72)';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);
        if (r > 0) {
            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, colorA);
            grad.addColorStop(1, colorB);
            ctx.shadowBlur = 8;
            ctx.shadowColor = colorB;
            ctx.fillStyle = grad;
            ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * r), Math.max(0, h - 4));
        }
        ctx.shadowBlur = 0;
        if (label) {
            ctx.font = '12px Jua';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(label, x + w / 2, y + h / 2 + 1);
        }
        ctx.restore();
    }

    function drawSparkParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        });
    }

    function drawVisualEffects() {
        visualEffects.forEach(eff => {
            if (eff.type !== 'pulse') return;
            const progress = 1 - Math.max(0, eff.duration) / eff.maxDuration;
            const radius = eff.radius * progress;
            const alpha = Math.max(0, 1 - progress);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = eff.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = eff.color;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        });
    }

        enemyUltEffects.forEach(eff => {

                ctx.strokeStyle = `rgba(255, 51, 0, ${1 - e.actionTimer/2000})`; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        if (activeUltTimer > 0 && selectedUlt === 'flame') {
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(activeUltData.angle);

            ctx.fillStyle = 'rgba(255, 88, 16, 0.10)'; ctx.fill();

            for (let f = 0; f < 5; f++) {

                grad.addColorStop(0.45, 'rgba(255, 80, 20, 0.32)');

        items.forEach(item => {

            ctx.lineWidth = 2; ctx.shadowBlur = 8; ctx.shadowColor = ctx.strokeStyle; ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.42)';
            ctx.lineWidth = Math.max(2, p.radius * 0.8);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fillStyle = '#7DF9FF'; ctx.shadowBlur = 8; ctx.shadowColor = '#00E5FF'; ctx.fill(); ctx.shadowBlur = 0;
        });
        
        enemies.forEach(e => drawEnemy(e));
        
        ultEffects.forEach(eff => {

                    ctx.restore();

                ctx.strokeStyle = `rgba(255, 51, 102, ${0.25 + Math.sin(now / 80) * 0.15})`; ctx.lineWidth = 2; ctx.stroke();

            const breathe = isMoving ? 0 : Math.sin(performance.now() / 260) * 1.5;
            const tilt = isMoving ? Math.max(-0.18, Math.min(0.18, ((keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0)) * 0.14 + (currentControlType === 'mouse' ? (targetX - player.x) * 0.0012 : 0))) : 0;
            const spriteSize = 62 + breathe;

            ctx.translate(player.x, player.y);
            ctx.rotate(tilt);

            ctx.drawImage(playerSprite, -spriteSize / 2, -spriteSize * 0.62, spriteSize, spriteSize);

    function gameLoop(timestamp) {
        if (!isPlaying) return;
        try {
            const deltaTime = Math.min(50, timestamp - (lastTime || timestamp));
            lastTime = timestamp;
            update(deltaTime);
            draw();
            if (timestamp - lastAutosaveAt >= ACTIVE_GAME_AUTOSAVE_MS) {
                saveActiveGame();
                lastAutosaveAt = timestamp;
            }
        } catch (error) {
            recoverFromFrameError(error);
        }
        animationFrameId = requestAnimationFrame(gameLoop);
    }
    
    function gameOver() {
        if (gameOverProcessed) return;
        gameOverProcessed = true;
        clearActiveGameSave();
        isPlaying = false; cancelAnimationFrame(animationFrameId);
        quitBtn.style.display = 'none'; 
        
        let earnedHTML = "";
        
        if (level < 5) {
            earnedHTML = "<div style='color:#ccc; font-size:24px; margin-top:10px;'>5레벨 도달 실패... 보상 없음 😢</div><div style='font-size:16px; color:#aaa; margin-top:5px;'>최소 5레벨을 넘겨야 랜덤 조각 상자가 지급됩니다.</div>";
        } else {
            const rewardUnit = currentDifficulty === 'hard' ? BALANCE.hardRewardScoreUnit : BALANCE.normalRewardScoreUnit;
            let calcBoxes = 1 + Math.floor(score / rewardUnit);
            let totalBoxes = Math.min(BALANCE.maxRewardBoxes, calcBoxes);
            
            let fragCounts = {};
            let availableChars = ['dog', 'cat', 'rabbit', 'bear', 'chick', 'wolf'];
            let totalFragmentsGained = 0;

            for(let i=0; i<totalBoxes; i++) {
                let randomChar = availableChars[Math.floor(Math.random() * availableChars.length)];
                let r = Math.random();
                let amount = 1;
                if (r > 0.9) amount = 5; 
                else if (r > 0.7) amount = 2; 
                
                fragCounts[randomChar] = (fragCounts[randomChar] || 0) + amount;
                charFragments[randomChar] = (charFragments[randomChar] || 0) + amount;
                totalFragmentsGained += amount;
            }
            
            earnedHTML = `<div style='font-size:25px; color:#39FF14; margin-top:10px;'>🎁 조각 상자 ${totalBoxes}개 오픈! (총 ${totalFragmentsGained}개 획득) 🎁</div><div style='display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;'>`;
            for(let cId in fragCounts) {
                let cObj = CHARACTERS.find(c => c.id === cId);
                earnedHTML += `<span style="background:#2A2A4D; padding:5px 12px; border-radius:10px; border:2px solid ${COLORS[Math.floor(Math.random()*COLORS.length)]}; font-size:20px;">${cObj.icon} +${fragCounts[cId]}</span>`;
            }
            earnedHTML += "</div>";
            saveUserData();
        }
        
        if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에")) {
            const collectionName = currentDifficulty === 'hard' ? "scores_v2_hard" : "scores_v2_normal";
            const scoreData = {
                name: currentNickname,
                score: Number(score) || 0,
                level: Number(level) || 1,
                mode: currentDifficulty,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            const scoreRef = db.collection(collectionName).doc(currentNickname);
            scoreRef.get().then((doc) => {
                if (!doc.exists || (Number(doc.data().score) || 0) < scoreData.score) {
                    return scoreRef.set(scoreData, { merge: true });
                }
            }).catch((error) => {
                console.error("점수 저장 실패:", error);
                const rewardBox = document.getElementById('earnedFragmentsText');
                if (rewardBox) rewardBox.innerHTML += "<div style='color:#FF9933; margin-top:8px;'>⚠️ 점수 저장 실패: Firestore 규칙을 확인해주세요.</div>";
            });
        }

        screens.gameOver.style.display = 'flex'; canvas.style.display = 'none';
        document.getElementById('finalScoreText').innerText = `${score}점`;
        document.getElementById('earnedFragmentsText').innerHTML = earnedHTML;
    }

    function updateHomeUI() {
        const isAdmin = document.getElementById('nicknameInput').value === '식이쌤관리자';
        const selectedDiff = document.querySelector('input[name="difficultyMode"]:checked').value;
        document.getElementById('homeLbTitle').innerText = selectedDiff === 'hard' ? '🏆 2.0 하드 모드 명예의 전당 (Top 5) 🏆' : '🏆 2.0 노말 모드 명예의 전당 (Top 5) 🏆';
        document.getElementById('fullLbTitle').innerText = selectedDiff === 'hard' ? '🏆 2.0 하드 모드 전체 랭킹 🏆' : '🏆 2.0 노말 모드 전체 랭킹 🏆';
        
        const currentLB = selectedDiff === 'hard' ? leaderboardsHard : leaderboardsNormal;
        const collName = selectedDiff === 'hard' ? 'scores_v2_hard' : 'scores_v2_normal';
        const currentError = selectedDiff === 'hard' ? leaderboardErrors.hard : leaderboardErrors.normal;
        if (currentError) {
            const msg = `<li style="color:#FF9933;">랭킹 불러오기 실패: Firestore 규칙 또는 네트워크를 확인하세요.</li>`;
            document.getElementById('homeLeaderboard').innerHTML = msg;
            const fullLeaderboardEl = document.getElementById('fullLeaderboard');
            if (fullLeaderboardEl) fullLeaderboardEl.innerHTML = msg;
            return;
        }
        const validLB = currentLB
            .filter(e => e && typeof e.name !== 'undefined' && typeof e.score !== 'undefined')
            .sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));

        const top5 = validLB.slice(0, 5);
        const homeHtml = top5.length ? top5.map((e, i) => `
            <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <span>${i + 1}. ${escapeHtml(e.name)}</span> 
                <div>
                    <span style="color:#FFD700">${Number(e.score) || 0}점</span>
                    ${isAdmin && e.id ? `<button onclick="deleteRecord('${e.id}', '${collName}')" style="margin-left:10px; background:#FF3366; color:white; border:none; border-radius:5px; cursor:pointer; font-family:'Jua'; padding:2px 8px;">삭제</button>` : ''}
                </div>
            </li>`).join('') : '<li>기록 없음</li>';
        document.getElementById('homeLeaderboard').innerHTML = homeHtml;

        const fullHtml = validLB.length ? validLB.map((e, i) => `
            <li style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0;">
                <span><strong style="color:${i<3?'#FF3366':'#00E5FF'}">${i + 1}위.</strong> ${escapeHtml(e.name)} (Lv.${Number(e.level) || 1})</span> 
                <div>
                    <span style="color:#FFD700">${Number(e.score) || 0}점</span>
                    ${isAdmin && e.id ? `<button onclick="deleteRecord('${e.id}', '${collName}')" style="margin-left:10px; background:#FF3366; color:white; border:none; border-radius:5px; cursor:pointer; font-family:'Jua'; padding:2px 8px;">삭제</button>` : ''}
                </div>
            </li>`).join('') : '<li>기록 없음</li>';

        const fullLeaderboardEl = document.getElementById('fullLeaderboard');
        if (fullLeaderboardEl) fullLeaderboardEl.innerHTML = fullHtml;
    }

    document.getElementById('nicknameInput').addEventListener('input', (e) => {
        const cleaned = getCleanNickname(e.target.value);
        if (e.target.value !== cleaned) e.target.value = cleaned;
        localStorage.setItem('vamp_last_nickname_v2', cleaned);
        updateHomeUI();
    });

    document.getElementById('startBtn').onclick = async () => { 
        let nick = getCleanNickname(document.getElementById('nicknameInput').value);
        if (!nick) return alert("❌ 닉네임(아이디)을 먼저 입력해주세요!\n데이터가 클라우드에 자동 저장됩니다.");
        
        currentNickname = nick;
        if (currentNickname === '식이쌤관리자') currentNickname = "관리자";

        const btn = document.getElementById('startBtn');
        const originalText = btn.innerText;
        btn.innerText = "불러오는 중...";
        await syncUserData(currentNickname);
        btn.innerText = originalText;
        
        const selectedControl = document.querySelector('input[name="controlMode"]:checked');
        if (selectedControl) currentControlType = selectedControl.value;

        // 🔥 난이도 세팅
        const selectedDiff = document.querySelector('input[name="difficultyMode"]:checked');
        if (selectedDiff) currentDifficulty = selectedDiff.value;
        
        screens.home.style.display = 'none'; 
        canvas.style.display = 'block'; 
        quitBtn.style.display = 'block'; 
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        
        clearActiveGameSave();
        initGameStats(); 
        isPlaying = true; 
        lastAutosaveAt = performance.now();
        requestAnimationFrame(gameLoop); 
    };
    
    document.getElementById('openStoreBtn').onclick = async () => { 
        let nick = getCleanNickname(document.getElementById('nicknameInput').value);
        if (!nick) return alert("❌ 닉네임(아이디)을 먼저 입력해주세요!\n데이터가 클라우드에 자동 저장됩니다.");
        
        currentNickname = nick;
        if (currentNickname === '식이쌤관리자') currentNickname = "관리자";

        const btn = document.getElementById('openStoreBtn');
        btn.innerText = "불러오는 중...";
        await syncUserData(currentNickname);
        btn.innerText = "캐릭터 상점";

        screens.home.style.display = 'none'; 
        screens.store.style.display = 'flex'; 
        renderStore(); 
    };

    document.getElementById('closeStoreBtn').onclick = () => { screens.store.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };
    
    document.getElementById('rankingBtn').onclick = () => { screens.home.style.display = 'none'; screens.ranking.style.display = 'flex'; updateHomeUI(); };
    document.getElementById('closeRankingBtn').onclick = () => { screens.ranking.style.display = 'none'; screens.home.style.display = 'flex'; };

    document.getElementById('restartBtn').onclick = () => { screens.gameOver.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };

    window.addEventListener('pagehide', saveActiveGame);
    window.addEventListener('beforeunload', saveActiveGame);

    if (!restoreActiveGameFromSave()) updateHomeUI();
</script>
</body>
</html>
