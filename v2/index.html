            ctx.fillStyle = grad;
            ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * r), Math.max(0, h - 4));
        }
        ctx.shadowBlur = 0;
        if (label) {
            ctx.font = '12px Jua';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(label, x + w / 2, y + h / 2 + 1);
        }
        ctx.restore();
    }

    function drawSparkParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        });
    }

    function drawVisualEffects() {
        visualEffects.forEach(eff => {
            if (eff.type !== 'pulse') return;
            const progress = 1 - Math.max(0, eff.duration) / eff.maxDuration;
            const radius = eff.radius * progress;
            const alpha = Math.max(0, 1 - progress);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = eff.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = eff.color;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        });
    }

    function draw() {
        ctx.save(); if (shakeAmount > 0) ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
        const now = Date.now();
        drawNeonBackground(now);
        drawVisualEffects();

        let sizeMod = 1.0 + (ultStats.sizeLevel * 0.25);

        blackHoles.forEach(bh => {
            ctx.save(); ctx.translate(bh.x, bh.y);
            const p = 1 + Math.sin(now / 200) * 0.1;
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius * p);
            grad.addColorStop(0, 'rgba(0, 0, 0, 0.9)'); grad.addColorStop(0.35, 'rgba(45, 0, 90, 0.35)'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, bh.radius * p, 0, Math.PI*2); ctx.fill();
            ctx.rotate(now / 500);
            ctx.strokeStyle = 'rgba(176, 38, 255, 0.72)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 46 * p, 0, Math.PI*1.5); ctx.stroke();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 68 * p, Math.PI * 0.2, Math.PI*1.7); ctx.stroke();
            drawEffectSprite('ult_blackhole', 0, 0, 82 * p, now / 800);
            ctx.restore();
        });

        enemyBlackHoles.forEach(bh => {
            ctx.save(); ctx.translate(bh.x, bh.y);
            const p = 1 + Math.sin(now / 150) * 0.1;
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius * p);
            grad.addColorStop(0, 'rgba(20, 0, 28, 0.85)'); grad.addColorStop(0.32, 'rgba(80, 0, 120, 0.32)'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, bh.radius * p, 0, Math.PI*2); ctx.fill();
            ctx.rotate(-now / 400); ctx.strokeStyle = 'rgba(255, 51, 102, 0.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 44 * p, 0, Math.PI*1.5); ctx.stroke();
            drawEffectSprite('ult_blackhole', 0, 0, 78 * p, -now / 900);
            ctx.restore();
        });

        dangerZones.forEach(dz => {
            const blink = 0.45 + Math.sin(now / 90) * 0.25;
            ctx.beginPath(); ctx.arc(dz.x, dz.y, dz.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 48, 96, ${0.06 + (1 - Math.max(0, dz.timer)/2200)*0.18})`; 
            ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = '#FF3366';
            ctx.strokeStyle = `rgba(255, 51, 102, ${blink})`; ctx.lineWidth = 2; ctx.stroke();
            ctx.shadowBlur = 0;
        });

        enemyProjectiles.forEach(ep => {
            ctx.beginPath(); ctx.moveTo(ep.x - ep.vx * 3, ep.y - ep.vy * 3); ctx.lineTo(ep.x, ep.y);
            ctx.strokeStyle = ep.color === '#FF3300' ? 'rgba(255, 112, 36, 0.55)' : 'rgba(0, 229, 255, 0.5)';
            ctx.lineWidth = ep.radius;
            ctx.stroke();
            ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI*2);
            ctx.fillStyle = ep.color; ctx.shadowBlur = 10; ctx.shadowColor = ep.color; ctx.fill();
            ctx.shadowBlur = 0;
        });

        enemyUltEffects.forEach(eff => {
            const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
            const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
            ctx.save(); ctx.translate(curX, curY);
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
            ctx.fillStyle = '#9900FF'; ctx.shadowBlur = 20; ctx.shadowColor = '#FF0000'; ctx.fill();
            ctx.restore();
            ctx.beginPath(); ctx.arc(eff.targetX, eff.targetY, 80, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)'; ctx.lineWidth = 2; ctx.stroke();
        });

        enemies.forEach(e => {
            if (e.isElite && e.eliteType === 'charger' && e.subState === 'aim') {
                ctx.beginPath(); ctx.moveTo(e.x, e.y);
                ctx.lineTo(e.x + Math.cos(e.angle)*800, e.y + Math.sin(e.angle)*800);
                ctx.strokeStyle = `rgba(255, 51, 0, ${1 - e.actionTimer/2000})`; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        if (activeUltTimer > 0 && selectedUlt === 'flame') {
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(activeUltData.angle);
            ctx.beginPath(); ctx.arc(0, 0, BALANCE.flameRadius * sizeMod, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 88, 16, 0.10)'; ctx.fill();
            ctx.shadowBlur = 14; ctx.shadowColor = '#FF6633';
            ctx.strokeStyle = 'rgba(255, 120, 20, 0.55)'; ctx.lineWidth = 2; ctx.stroke();
            for (let f = 0; f < 5; f++) {
                ctx.rotate(Math.PI * 2 / 5);
                const grad = ctx.createLinearGradient(0, 0, BALANCE.flameRadius * sizeMod, 0);
                grad.addColorStop(0, 'rgba(255, 230, 120, 0.55)');
                grad.addColorStop(0.45, 'rgba(255, 80, 20, 0.32)');
                grad.addColorStop(1, 'rgba(255, 32, 96, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(10, -7, BALANCE.flameRadius * sizeMod, 14);
            }
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        items.forEach(item => {
            const itemKey = item.type === 'heart' ? 'item_heart' : (item.type === 'bomb' ? 'item_bomb' : 'item_blackhole');
            const pulseSize = 38 + Math.sin(item.pulse * 2) * 2;
            ctx.save(); ctx.translate(item.x, item.y);
            ctx.beginPath(); ctx.arc(0, 0, item.radius + 6, 0, Math.PI*2);
            ctx.strokeStyle = item.type === 'heart' ? 'rgba(255, 80, 150, 0.55)' : (item.type === 'bomb' ? 'rgba(0, 229, 255, 0.5)' : 'rgba(176, 38, 255, 0.7)');
            ctx.lineWidth = 2; ctx.shadowBlur = 8; ctx.shadowColor = ctx.strokeStyle; ctx.stroke();
            ctx.restore();
            drawEffectSprite(itemKey, item.x, item.y, pulseSize, item.pulse, () => {
                ctx.save(); ctx.translate(item.x, item.y); ctx.rotate(item.pulse); 
                ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(item.type === 'heart' ? '💖' : (item.type === 'bomb' ? '💣' : '🌀'), 0, 0);
                ctx.restore();
            });
        });

        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(p.x - p.velocity.x * 2.4, p.y - p.velocity.y * 2.4);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.42)';
            ctx.lineWidth = Math.max(2, p.radius * 0.8);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fillStyle = '#7DF9FF'; ctx.shadowBlur = 8; ctx.shadowColor = '#00E5FF'; ctx.fill(); ctx.shadowBlur = 0;
        });
        
        enemies.forEach(e => drawEnemy(e));
        
        ultEffects.forEach(eff => {
            if (eff.type === 'bomb') {
                ctx.save(); ctx.translate(eff.x, eff.y);
                const scale = (1 + Math.sin(now / 100) * 0.08) * sizeMod; 
                const charge = 1 - Math.max(0, eff.timer) / eff.maxTimer;
                ctx.beginPath(); ctx.arc(0, 0, (48 + charge * 95) * sizeMod, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 110, 28, ${0.55 - charge * 0.2})`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 14; ctx.shadowColor = '#FF6633';
                ctx.stroke();
                ctx.shadowBlur = 0;
                drawEffectSprite('ult_bomb', 0, 0, 58 * scale, now / 450, () => {
                    ctx.font = '50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💣', 0, 0);
                });
                ctx.beginPath(); ctx.arc(0, 0, 35, -Math.PI/2, -Math.PI/2 + (eff.timer/eff.maxTimer)*Math.PI*2);
                ctx.lineWidth = 4; ctx.strokeStyle = '#FF3366'; ctx.stroke();
                ctx.restore();
            } else if (eff.type === 'meteor') {
                const curX = eff.startX + (eff.targetX - eff.startX) * eff.progress;
                const curY = eff.startY + (eff.targetY - eff.startY) * eff.progress;
                const meteorAngle = Math.atan2(eff.targetY - eff.startY, eff.targetX - eff.startX) + Math.PI / 4;
                drawEffectSprite('ult_meteor', curX, curY, 54 * sizeMod, meteorAngle, () => {
                    ctx.save(); ctx.translate(curX, curY);
                    ctx.beginPath(); ctx.arc(0, 0, 15 * sizeMod, 0, Math.PI*2);
                    ctx.fillStyle = '#FFF500'; ctx.shadowBlur = 20; ctx.shadowColor = '#FF3366'; ctx.fill();
                    ctx.restore();
                });
                ctx.beginPath(); ctx.arc(eff.targetX, eff.targetY, 120 * sizeMod, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 51, 102, ${0.25 + Math.sin(now / 80) * 0.15})`; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        drawSparkParticles();

        const playerSprite = getCharacterSprite(equippedCharId);
        if (playerSprite) {
            const isMoving = keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight || keys.w || keys.a || keys.s || keys.d || (currentControlType === 'mouse' && Math.hypot(targetX - player.x, targetY - player.y) > 6);
            const breathe = isMoving ? 0 : Math.sin(performance.now() / 260) * 1.5;
            const tilt = isMoving ? Math.max(-0.18, Math.min(0.18, ((keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0)) * 0.14 + (currentControlType === 'mouse' ? (targetX - player.x) * 0.0012 : 0))) : 0;
            const spriteSize = 62 + breathe;
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(tilt);
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#00E5FF';
            ctx.drawImage(playerSprite, -spriteSize / 2, -spriteSize * 0.62, spriteSize, spriteSize);
            ctx.restore();
        } else {
            drawFallbackPlayerIcon();
        }

        if (weapons.orbitals > 0) {
            for(let o=0; o<weapons.orbitals; o++) {
                const ox = player.x + Math.cos(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * BALANCE.orbitalRadius;
                const oy = player.y + Math.sin(weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals))) * BALANCE.orbitalRadius;
                const bladeAngle = weapons.orbitalAngle + (o * (Math.PI*2 / weapons.orbitals)) + Math.PI / 2;
                const drewBlade = drawEffectSprite('orbital_blade', ox, oy, 42, bladeAngle);
                if (!drewBlade) {
                    ctx.fillStyle = '#39FF14';
                    ctx.beginPath(); ctx.arc(ox, oy, 13, 0, Math.PI*2); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
                }
            }
        }
        
        if (selectedUlt && selectedUlt !== 'pending') {
            const gaugeWidth = 40; const gaugeRatio = Math.min(1, ultGauge / ultMax);
            drawNeonBar(
                player.x - gaugeWidth/2,
                player.y + 25,
                gaugeWidth,
                6,
                gaugeRatio,
                activeUltTimer > 0 || ultEffects.length > 0 ? '#FF3366' : '#B026FF',
                activeUltTimer > 0 || ultEffects.length > 0 ? '#FFD166' : '#FF5CFF',
                ''
            );
        }

        if (damageFlash > 0) { ctx.fillStyle = `rgba(0, 229, 255, ${Math.min(0.22, damageFlash * 0.7)})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        if (ultFlash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${ultFlash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.restore();

        ctx.fillStyle = 'rgba(4, 8, 20, 0.82)'; ctx.fillRect(0, 0, canvas.width, 54);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 54); ctx.lineTo(canvas.width, 54); ctx.stroke();
        ctx.fillStyle = '#00E5FF'; ctx.font = '24px Jua'; ctx.textAlign = 'left'; ctx.fillText(`LV: ${level} (${player.icon})`, 20, 35);
        ctx.textAlign = 'right'; ctx.fillStyle = '#FFD700'; ctx.fillText(`SCORE: ${score}`, canvas.width - 20, 35);
        ctx.fillStyle = '#FF5C8A'; ctx.textAlign = 'center'; ctx.fillText(`HP: ${Math.floor(player.hp)}`, canvas.width/2, 25);
        drawNeonBar(canvas.width / 2 - 72, 34, 144, 10, player.hp / player.maxHp, '#FF3366', '#7DF9FF', '', '#FF5C8A');
        drawNeonBar(0, canvas.height - 16, canvas.width, 16, exp / maxExp, '#007BFF', '#00E5FF', '', '#00E5FF');
    }

    function gameLoop(timestamp) {
        if (!isPlaying) return;
        try {
            const deltaTime = Math.min(50, timestamp - (lastTime || timestamp));
            lastTime = timestamp;
            update(deltaTime);
            draw();
            if (timestamp - lastAutosaveAt >= ACTIVE_GAME_AUTOSAVE_MS) {
                saveActiveGame();
                lastAutosaveAt = timestamp;
            }
        } catch (error) {
            recoverFromFrameError(error);
        }
        animationFrameId = requestAnimationFrame(gameLoop);
    }
    
    function gameOver() {
        if (gameOverProcessed) return;
        gameOverProcessed = true;
        clearActiveGameSave();
        isPlaying = false; cancelAnimationFrame(animationFrameId);
        quitBtn.style.display = 'none'; 
        
        let earnedHTML = "";
        
        if (level < 5) {
            earnedHTML = "<div style='color:#ccc; font-size:24px; margin-top:10px;'>5레벨 도달 실패... 보상 없음 😢</div><div style='font-size:16px; color:#aaa; margin-top:5px;'>최소 5레벨을 넘겨야 랜덤 조각 상자가 지급됩니다.</div>";
        } else {
            const rewardUnit = currentDifficulty === 'hard' ? BALANCE.hardRewardScoreUnit : BALANCE.normalRewardScoreUnit;
            let calcBoxes = 1 + Math.floor(score / rewardUnit);
            let totalBoxes = Math.min(BALANCE.maxRewardBoxes, calcBoxes);
            
            let fragCounts = {};
            let availableChars = ['dog', 'cat', 'rabbit', 'bear', 'chick', 'wolf'];
            let totalFragmentsGained = 0;

            for(let i=0; i<totalBoxes; i++) {
                let randomChar = availableChars[Math.floor(Math.random() * availableChars.length)];
                let r = Math.random();
                let amount = 1;
                if (r > 0.9) amount = 5; 
                else if (r > 0.7) amount = 2; 
                
                fragCounts[randomChar] = (fragCounts[randomChar] || 0) + amount;
                charFragments[randomChar] = (charFragments[randomChar] || 0) + amount;
                totalFragmentsGained += amount;
            }
            
            earnedHTML = `<div style='font-size:25px; color:#39FF14; margin-top:10px;'>🎁 조각 상자 ${totalBoxes}개 오픈! (총 ${totalFragmentsGained}개 획득) 🎁</div><div style='display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;'>`;
            for(let cId in fragCounts) {
                let cObj = CHARACTERS.find(c => c.id === cId);
                earnedHTML += `<span style="background:#2A2A4D; padding:5px 12px; border-radius:10px; border:2px solid ${COLORS[Math.floor(Math.random()*COLORS.length)]}; font-size:20px;">${cObj.icon} +${fragCounts[cId]}</span>`;
            }
            earnedHTML += "</div>";
            saveUserData();
        }
        
        if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에")) {
            const collectionName = currentDifficulty === 'hard' ? "scores_v2_hard" : "scores_v2_normal";
            const scoreData = {
                name: currentNickname,
                score: Number(score) || 0,
                level: Number(level) || 1,
                mode: currentDifficulty,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            const scoreRef = db.collection(collectionName).doc(currentNickname);
            scoreRef.get().then((doc) => {
                if (!doc.exists || (Number(doc.data().score) || 0) < scoreData.score) {
                    return scoreRef.set(scoreData, { merge: true });
                }
            }).catch((error) => {
                console.error("점수 저장 실패:", error);
                const rewardBox = document.getElementById('earnedFragmentsText');
                if (rewardBox) rewardBox.innerHTML += "<div style='color:#FF9933; margin-top:8px;'>⚠️ 점수 저장 실패: Firestore 규칙을 확인해주세요.</div>";
            });
        }

        screens.gameOver.style.display = 'flex'; canvas.style.display = 'none';
        document.getElementById('finalScoreText').innerText = `${score}점`;
        document.getElementById('earnedFragmentsText').innerHTML = earnedHTML;
    }

        const btn = document.getElementById('openStoreBtn');
        btn.innerText = "불러오는 중...";
        await syncUserData(currentNickname);
        btn.innerText = "캐릭터 상점";

        screens.home.style.display = 'none'; 
        screens.store.style.display = 'flex'; 
        renderStore(); 
    };

    document.getElementById('closeStoreBtn').onclick = () => { screens.store.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };
    
    document.getElementById('rankingBtn').onclick = () => { screens.home.style.display = 'none'; screens.ranking.style.display = 'flex'; updateHomeUI(); };
    document.getElementById('closeRankingBtn').onclick = () => { screens.ranking.style.display = 'none'; screens.home.style.display = 'flex'; };

    document.getElementById('restartBtn').onclick = () => { screens.gameOver.style.display = 'none'; screens.home.style.display = 'flex'; updateHomeUI(); };

    window.addEventListener('pagehide', saveActiveGame);
    window.addEventListener('beforeunload', saveActiveGame);

    if (!restoreActiveGameFromSave()) updateHomeUI();
</script>
</body>
</html>
